name: SEO Audit — mensagemstudio.shop

on:
  push:
    branches:
      - main
    paths:
      - 'wix-preview/**'
      - 'index.html'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
      - '.github/workflows/seo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          import xml.etree.ElementTree as ET

          base = "https://mensagemstudio.shop/"
          slugs = [
              "produto-3d-egeo",
              "carrossel-banner-estetica",
              "edicao-podcast-workshop",
              "motion-ia-video-campanhas",
              "suco-laranja-natural-one",
              "esporte-fitness",
              "creatina-growth",
              "personagens-consistentes-com-ia",
              "fotos-para-ecommerce",
              "motors-vans",
              "edicao-fantasia-photoshop",
              "poster-cartaz",
              "motion-banner-cartaz-cinematografico",
          ]
          pages = {
              "index.html": base,
              "portfolio/index.html": base + "portfolio/",
              "servicos/index.html": base + "servicos/",
              "sobre/index.html": base + "sobre/",
          }
          pages.update({
              f"portfolio/{slug}/index.html": base + f"portfolio/{slug}/"
              for slug in slugs
          })

          errors = []
          for path, canonical in pages.items():
              p = Path(path)
              if not p.exists():
                  errors.append(f"MISSING PAGE: {path}")
                  continue
              html = p.read_text(encoding="utf-8")
              checks = {
                  "title": r"<title>[^<]{8,}</title>",
                  "description": r'<meta\s+name=["\']description["\'][^>]+content=["\'][^"\']{60,}["\']',
                  "robots": r'<meta\s+name=["\']robots["\'][^>]+content=["\'][^"\']*index[^"\']*follow',
                  "canonical": re.escape(f'rel="canonical" href="{canonical}"'),
                  "og:title": r'property=["\']og:title["\']',
                  "og:description": r'property=["\']og:description["\']',
                  "og:image": r'property=["\']og:image["\']',
                  "jsonld": r'application/ld\+json',
              }
              for label, pattern in checks.items():
                  if not re.search(pattern, html, flags=re.I | re.S):
                      errors.append(f"{path}: missing/invalid {label}")
              if "Wix Preview" in html:
                  errors.append(f"{path}: homologation title/text leaked into SEO")
              if 'canonical" href="https://mensagemstudio.shop/wix-preview/' in html:
                  errors.append(f"{path}: canonical points to wix-preview")

          sitemap = Path("sitemap.xml")
          if not sitemap.exists():
              errors.append("MISSING sitemap.xml")
          else:
              root = ET.fromstring(sitemap.read_text(encoding="utf-8"))
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls = [x.text.strip() for x in root.findall("sm:url/sm:loc", ns) if x.text]
              expected = list(pages.values())
              if len(urls) != 17:
                  errors.append(f"sitemap.xml: expected 17 URLs, got {len(urls)}")
              if len(urls) != len(set(urls)):
                  errors.append("sitemap.xml: duplicate URLs")
              if set(urls) != set(expected):
                  errors.append("sitemap.xml: URL set does not match the new site")
              if any("/wix-preview/" in u or "/projetos/" in u for u in urls):
                  errors.append("sitemap.xml: legacy/source URL present")

          robots = Path("robots.txt").read_text(encoding="utf-8") if Path("robots.txt").exists() else ""
          if "Sitemap: https://mensagemstudio.shop/sitemap.xml" not in robots:
              errors.append("robots.txt: sitemap declaration missing")
          if "Disallow: /wix-preview/" not in robots:
              errors.append("robots.txt: source preview is not blocked")

          pjs = Path("portfolio/project-page.js")
          if not pjs.exists() or "<h1>" not in pjs.read_text(encoding="utf-8"):
              errors.append("project renderer: H1 not found")

          if errors:
              print("\n".join("ERROR: " + e for e in errors))
              sys.exit(1)

          print(f"SEO PASS: {len(pages)} indexable pages validated.")
          print("Canonical domain: https://mensagemstudio.shop/")
          print("Sitemap: 17/17 URLs.")
          PY
