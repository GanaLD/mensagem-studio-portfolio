name: R2.2 Stage9 DNS Fast

on:
  push:
    branches:
      - r22-stage9-candidate-20260904
    paths:
      - .github/workflows/r22-stage9-dns-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fast DNS probe
        shell: bash
        run: |
          set +e
          D=mensagemstudio.shop
          W=www.mensagemstudio.shop
          echo "TIME=$(date -u +%FT%TZ)"
          echo "A_GOOGLE:"; dig +time=2 +tries=1 +short @8.8.8.8 A "$D"
          echo "AAAA_GOOGLE:"; dig +time=2 +tries=1 +short @8.8.8.8 AAAA "$D"
          echo "NS_GOOGLE:"; dig +time=2 +tries=1 +short @8.8.8.8 NS "$D"
          echo "CNAME_WWW_GOOGLE:"; dig +time=2 +tries=1 +short @8.8.8.8 CNAME "$W"
          echo "A_CLOUDFLARE:"; dig +time=2 +tries=1 +short @1.1.1.1 A "$D"
          echo "CNAME_WWW_CLOUDFLARE:"; dig +time=2 +tries=1 +short @1.1.1.1 CNAME "$W"
          echo "HTTPS_CURRENT:"; curl -skI --connect-timeout 3 --max-time 6 "https://$D/" | head -n 20
          echo "FORCED_108:"; curl -skI --connect-timeout 3 --max-time 6 --resolve "$D:443:185.199.108.153" "https://$D/" | head -n 20
          echo "FORCED_109:"; curl -skI --connect-timeout 3 --max-time 6 --resolve "$D:443:185.199.109.153" "https://$D/" | head -n 20
          echo "DEFAULT_HOST:"; curl -skI --connect-timeout 3 --max-time 6 "https://ganald.github.io/mensagem-studio-portfolio/" | head -n 20
