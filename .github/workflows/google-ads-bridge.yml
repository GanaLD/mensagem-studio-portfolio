name: Google Ads bridge — safety and PMax reports
on:
  pull_request:
    paths:
      - 'scripts/google_ads_sheets_bridge.gs'
      - 'tests/google-ads-bridge.test.cjs'
      - '.github/workflows/google-ads-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax, safeguards and PMax read coverage
        run: node --test tests/google-ads-bridge.test.cjs
