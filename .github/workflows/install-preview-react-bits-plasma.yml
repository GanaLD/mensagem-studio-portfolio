name: Install PREVIEW React Bits Plasma

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-preview-react-bits-plasma.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-preview-react-bits-plasma
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OGL
        working-directory: preview-21st-shader
        run: npm install ogl --save --no-audit --no-fund

      - name: Install React Bits Plasma with shadcn
        working-directory: preview-21st-shader
        run: npx shadcn@latest add @react-bits/Plasma-JS-CSS --yes

      - name: Show generated component files
        shell: bash
        run: |
          set -euo pipefail
          find preview-21st-shader/src -maxdepth 5 -type f | sort
          echo '--- package.json ---'
          cat preview-21st-shader/package.json

      - name: Commit OGL dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-21st-shader/package.json preview-21st-shader/package-lock.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Install React Bits Plasma and OGL for preview'
          git pull --rebase origin main
          git push
