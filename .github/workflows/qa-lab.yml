name: Confirma publicação e desempenho das três páginas
on:
  push:
    branches: [qa/performance-20261116]
    paths: ['.github/workflows/qa-lab.yml']
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
        slug: [video-ia, landing-pages, home]
    timeout-minutes: 45
    steps:
      - run: npm install --prefix /tmp/ms-lab lighthouse@12.8.2
      - name: Medir páginas com cache frio
        env:
          FORM: ${{ matrix.form }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p evidence
          google-chrome --version > evidence/chrome.txt
          for area in prod; do
            prefix=""
            if [[ $area == preview ]]; then prefix="wix-preview/"; fi
            for slug in "$SLUG"; do
              path="$slug/"
              if [[ $slug == home ]]; then path=""; fi
              refpath="$prefix${path}index.html"
              curl -fsSL --retry 3 "https://raw.githubusercontent.com/GanaLD/mensagem-studio-portfolio/6b65f83baa55bca5fbdc9c38efa4c9af4591b0d2/$refpath" > /tmp/expected
              for turn in {1..45}; do
                curl -fsSL "https://mensagemstudio.shop/$prefix$path?qa_lcp=6b65f83baa55bca5fbdc9c38efa4c9af4591b0d2" > /tmp/served || true
                if cmp -s /tmp/expected /tmp/served; then break; fi
                sleep 10
              done
              cmp /tmp/expected /tmp/served
              flags=()
              if [[ $FORM == desktop ]]; then flags+=(--preset=desktop); fi
              for rep in 1 2 3; do
                file="evidence/$area-$slug-$FORM-$rep.json"
                for attempt in 1 2 3; do
                  /tmp/ms-lab/node_modules/.bin/lighthouse "https://mensagemstudio.shop/$prefix$path" --quiet --only-categories=performance,accessibility --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" "${flags[@]}" --output=json --output-path="$file" && break
                  sleep 2
                done
                jq -ce 'select(.runtimeError == null and .audits["largest-contentful-paint"].numericValue != null) | {url:.finalDisplayedUrl,LCP:.audits["largest-contentful-paint"].numericValue,CLS:.audits["cumulative-layout-shift"].numericValue,TBT:.audits["total-blocking-time"].numericValue,bytes:.audits["total-byte-weight"].numericValue,perf:.categories.performance.score,a11y:.categories.accessibility.score,node:.audits["largest-contentful-paint-element"].details.items[0], blocking:[.audits["render-blocking-resources"].details.items[]? | {url,wastedMs}], breakdown:(.audits["lcp-phases-insight"].details // .audits["largest-contentful-paint-element"].details.items[1]),heavy:([.audits["network-requests"].details.items[]? | {url,transferSize}]|sort_by(-.transferSize)|.[0:4])}' "$file" > "$file.compact"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.slug }}-${{ matrix.form }}
          path: evidence/
          retention-days: 30
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6b65f83baa55bca5fbdc9c38efa4c9af4591b0d2
          path: site
          fetch-depth: 8
          sparse-checkout: |
            index.html
            video-ia
            landing-pages
          sparse-checkout-cone-mode: false
      - run: python -m pip -q install playwright==1.51.0 pillow
      - run: python qa-lcp/visual.py prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-producao
          path: evidence/
          retention-days: 30
  recibo:
    if: always()
    needs: [medir, visual]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/performance-20261116
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/medicoes
      - uses: actions/download-artifact@v4
        with:
          run-id: 43978618739
          github-token: ${{ github.token }}
          path: /tmp/baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 43980174851
          github-token: ${{ github.token }}
          path: /tmp/preview
      - uses: actions/download-artifact@v4
        with:
          run-id: 44126608578
          github-token: ${{ github.token }}
          path: /tmp/visual-preview
      - run: |
          mkdir -p qa-lcp
          python - <<'PY'
          import os, json, pathlib
          r=pathlib.Path('/tmp/medicoes')
          files={p.name:json.loads(p.read_text()) for p in r.rglob('*.compact') if p.stat().st_size}
          pathlib.Path('qa-lcp/production-final.json').write_text(json.dumps(dict(run=os.environ['GITHUB_RUN_ID'],chrome=[p.read_text().strip() for p in r.rglob('chrome.txt')],files=files),ensure_ascii=False))
          PY
          cp /tmp/medicoes/capturas-producao/prod/qa.json qa-lcp/production-visual.json
          python - <<'PY'
          import pathlib, zipfile
          target=pathlib.Path('qa-lcp/mobile-20261117')
          target.mkdir(exist_ok=True)
          for label,folder in [('producao','/tmp/medicoes'),('baseline','/tmp/baseline'),('preview','/tmp/preview'),('visual-preview','/tmp/visual-preview')]:
              with zipfile.ZipFile(target/(label+'.zip'),'w',zipfile.ZIP_DEFLATED) as z:
                  for f in pathlib.Path(folder).rglob('*'):
                      if f.is_file():z.write(f,str(f.relative_to(folder)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-lcp
          git commit -m "Arquiva resumo das medições mobile e desktop"
          git push origin HEAD:qa/performance-20261116
