name: Valida LCP preview
on:
  push:
    branches: [qa/performance-20261116]
    paths: ['.github/workflows/qa-lab.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 8
          sparse-checkout: |
            wix-preview/assets/lcp-fonts
            wix-preview/video-ia
            wix-preview/landing-pages
            wix-preview/index.html
          sparse-checkout-cone-mode: false
      - run: python -m pip -q install playwright==1.51.0 pillow
      - run: python qa-lcp/visual.py preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-preview
          path: evidence/
          retention-days: 30
  recibo:
    needs: visual
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/performance-20261116
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/qa
      - run: |
          mkdir -p qa-lcp/mobile-20261117
          cp /tmp/qa/capturas-preview/preview/*.json qa-lcp/mobile-20261117/
          echo '${{ github.run_id }}' > qa-lcp/mobile-20261117/visual-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-lcp/mobile-20261117
          git commit -m "Registra validação visual e funcional do preview"
          git push origin HEAD:qa/performance-20261116
