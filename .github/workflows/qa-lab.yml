name: Medir páginas comerciais e home
on:
  push:
    branches: [qa/performance-20261116]
permissions:
  contents: read
jobs:
  lighthouse:
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: npm install --prefix /tmp/ms-lab lighthouse@12.8.2
      - name: Medir produção original e homologação
        shell: bash
        env:
          FORM: ${{ matrix.form }}
        run: |
          set -eu
          mkdir evidence
          for page in home video-ia landing-pages; do
            slug="$page/"
            if [[ "$page" == home ]]; then slug=""; fi
            for phase in antes depois; do
              prefix=""
              if [[ "$phase" == depois ]]; then prefix="wix-preview/"; fi
              options=()
              if [[ "$FORM" == desktop ]]; then options+=(--preset=desktop); fi
              file="evidence/$phase-$page-$FORM.json"
              /tmp/ms-lab/node_modules/.bin/lighthouse "https://mensagemstudio.shop/$prefix$slug" --quiet --only-categories=performance,accessibility --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" "${options[@]}" --output=json --output-path="$file"
              jq -c '{url:.finalDisplayedUrl,perf:.categories.performance.score,a11y:.categories.accessibility.score,LCP:.audits["largest-contentful-paint"].numericValue,CLS:.audits["cumulative-layout-shift"].numericValue,TBT:.audits["total-blocking-time"].numericValue,bytes:.audits["total-byte-weight"].numericValue}' "$file"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.form }}
          path: evidence/
          retention-days: 7
  referencias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python -m pip install playwright==1.51.0
      - name: Medições exploratórias em duas larguras
        shell: bash
        run: |
          mkdir evidence
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          urls=['https://tbfilms.com.br/','https://znestudio.com/','https://walk.productions/','https://agenciafellowship.com.br/servicos','https://jfilms.com.br/','https://www.vs3dstudio.com/','https://www.tdgstudios.org/']
          rows=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome')
              for url in urls:
                  for width in (390,1366):
                      c=b.new_context(viewport={'width':width,'height':844})
                      page=c.new_page()
                      page.add_init_script("window.testMetrics={};new PerformanceObserver(l=>{for(let e of l.getEntries())window.testMetrics.lcp=e.startTime}).observe({type:'largest-contentful-paint',buffered:true})")
                      try:
                          res=page.goto(url,wait_until='domcontentloaded',timeout=22000)
                          page.wait_for_timeout(3000)
                          rows.append(dict(url=url,width=width,http=res.status,**page.evaluate("()=>({docWidth:document.documentElement.scrollWidth,lcp:window.testMetrics.lcp??null})")))
                      except Exception as e:rows.append(dict(url=url,width=width,error=str(e)[:90]))
                      c.close()
              b.close()
          open('evidence/concorrentes.json','w').write(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: concorrentes-mobile-desktop
          path: evidence/
          retention-days: 7
