name: Ensure Services RubberSegment

on:
  push:
    branches:
      - main
    paths:
      - 'servicos/index.html'
      - 'preview-21st-shader/dist-rubber/rubber-segment-services.js'
      - 'preview-21st-shader/dist-rubber/rubber-segment-services.css'
      - '.github/workflows/ensure-services-rubber-segment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensure-services-rubber-segment
  cancel-in-progress: true

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject approved React Bits RubberSegment into Services
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path("preview-21st-shader/dist-rubber/rubber-segment-services.css")
          js_path = Path("preview-21st-shader/dist-rubber/rubber-segment-services.js")
          if not css_path.exists() or not js_path.exists():
              raise SystemExit("RubberSegment bundle missing.")

          css = css_path.read_text(encoding="utf-8")
          js = js_path.read_text(encoding="utf-8")

          style_block = '<style id="ms-rubber-segment-inline-v5">\n' + css + '\n</style>'
          script_block = '<script id="ms-rubber-segment-runtime-v5">\n' + js + '\n</script>'

          targets = [Path("servicos/index.html"), Path("wix-preview/servicos/index.html")]

          for target in targets:
              text = target.read_text(encoding="utf-8")

              # Remove every older or current RubberSegment inline/external injection.
              text = re.sub(
                  r'<style id="ms-rubber-segment-inline-v\d+">[\s\S]*?</style>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script id="ms-rubber-segment-runtime-v\d+">[\s\S]*?</script>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<link[^>]+react-bits-rubber-segment/rubber-segment-services\.css[^>]*>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script[^>]+react-bits-rubber-segment/rubber-segment-services\.js[^>]*></script>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              if '</head>' not in text or '</body>' not in text:
                  raise SystemExit(f"{target}: malformed HTML")

              text = text.replace('</head>', style_block + '\n</head>', 1)
              text = text.replace('</body>', script_block + '\n</body>', 1)

              # Hard requirements from the approved implementation.
              required = [
                  'ms-rubber-segment-inline-v5',
                  'ms-rubber-segment-runtime-v5',
                  'rubber-segment-services-root',
                  'ms-services-rubber-segment',
                  'data-rubber-value',
                  'ms-legacy-filters-hidden',
              ]
              missing = [token for token in required if token not in text]
              if missing:
                  raise SystemExit(f"{target}: missing RubberSegment markers: {missing}")

              target.write_text(text, encoding="utf-8")
              print(f"{target}: RubberSegment injected and verified")
          PY

      - name: Commit if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add servicos/index.html wix-preview/servicos/index.html
          if git diff --cached --quiet; then
            echo "RubberSegment already current."
            exit 0
          fi
          git commit -m 'Ensure Services RubberSegment is installed'
          git pull --rebase origin main
          git push origin HEAD:main
