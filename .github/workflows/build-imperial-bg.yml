name: Build Imperial Asian Estate background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-imperial-bg.yml'
      - 'scripts/integrate_imperial_bg.py'

permissions:
  contents: write

jobs:
  build-imperial-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh gdown

      - name: Download Imperial Asian Estate source
        run: |
          rm -rf .tmp-imperial imperial-asian-estate.zip
          mkdir -p .tmp-imperial
          python -m gdown 'https://drive.google.com/uc?id=1FjJVyM4YUY0UAJnzVZjw-7m5yaElTkti' -O imperial-asian-estate.zip
          unzip -q imperial-asian-estate.zip -d .tmp-imperial
          test -f '.tmp-imperial/[OBJ] OC/OC.obj'

      - name: Build web GLB and patch preview
        run: |
          python scripts/integrate_imperial_bg.py
          test -s wix-preview/assets/imperial-asian-estate.glb
          grep -q 'imperialEstateBg' wix-preview/index.html

      - name: Commit generated preview asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wix-preview/index.html wix-preview/assets/imperial-asian-estate.glb
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate Imperial Asian Estate global background'
          git push
