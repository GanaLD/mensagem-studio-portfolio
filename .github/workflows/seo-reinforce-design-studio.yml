name: SEO Reinforce Design Studio

on:
  push:
    paths:
      - '.github/workflows/seo-reinforce-design-studio.yml'

permissions:
  contents: write

jobs:
  reinforce-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reinforce design studio query on home and Curitiba landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old[:90]!r}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          patch('index.html', [
              ('<title>Estúdio Criativo em Curitiba | Design, Vídeo, Branding e 3D</title>', '<title>Studio de Design Gráfico em Curitiba | Mensagem Studio</title>', 1),
              ('<meta name="description" content="Design studio e estúdio criativo em Curitiba para marcas e empresas: design gráfico, branding, direção de arte, vídeos, IA generativa, motion, 3D e web.">', '<meta name="description" content="Studio de design gráfico em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion, IA generativa, 3D, CGI e experiências web.">', 1),
              ('<meta property="og:title" content="Estúdio Criativo em Curitiba | Design, Vídeo, Branding e 3D">', '<meta property="og:title" content="Studio de Design Gráfico em Curitiba | Mensagem Studio">', 1),
              ('<meta property="og:description" content="Design studio e estúdio criativo em Curitiba para marcas e empresas: design gráfico, branding, direção de arte, vídeos, IA generativa, motion, 3D e web.">', '<meta property="og:description" content="Studio de design gráfico em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion, IA generativa, 3D, CGI e experiências web.">', 1),
              ('<meta property="og:image:alt" content="Estúdio Criativo em Curitiba | Design, Vídeo, Branding e 3D">', '<meta property="og:image:alt" content="Mensagem Studio — studio de design gráfico em Curitiba">', 1),
              ('<meta name="twitter:title" content="Estúdio Criativo em Curitiba | Design, Vídeo, Branding e 3D">', '<meta name="twitter:title" content="Studio de Design Gráfico em Curitiba | Mensagem Studio">', 1),
              ('<meta name="twitter:description" content="Design studio e estúdio criativo em Curitiba para marcas e empresas: design gráfico, branding, direção de arte, vídeos, IA generativa, motion, 3D e web.">', '<meta name="twitter:description" content="Studio de design gráfico em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion, IA generativa, 3D, CGI e experiências web.">', 1),
              ('"description":"Estúdio criativo em Curitiba com atuação em design gráfico, branding, direção de arte, audiovisual, motion, VFX, inteligência artificial generativa, modelagem 3D, CGI, e-commerce e experiências web."', '"description":"Studio de design gráfico e estúdio criativo em Curitiba com atuação em branding, direção de arte, audiovisual, motion, VFX, inteligência artificial generativa, modelagem 3D, CGI, e-commerce e experiências web."', 1),
              ('"Design Studio","Creative Studio","3D Studio","CGI Studio"', '"Studio de design gráfico","Estúdio de design gráfico","Design Studio","Creative Studio","3D Studio","CGI Studio"', 1),
              ('"name":"Estúdio Criativo em Curitiba | Design, Vídeo, Branding e 3D"', '"name":"Studio de Design Gráfico em Curitiba | Mensagem Studio"', 1),
              ('"description":"Design studio e estúdio criativo em Curitiba para marcas e empresas: design gráfico, branding, direção de arte, vídeos, IA generativa, motion, 3D e web."', '"description":"Studio de design gráfico em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion, IA generativa, 3D, CGI e experiências web."', 1),
              ('<h1 class="sr-only">Estúdio Criativo em Curitiba para Design, Vídeo, Branding e 3D</h1>', '<h1 class="sr-only">Studio de Design Gráfico e Estúdio Criativo em Curitiba</h1>', 1),
              ('<p>Design, motion, 3D, web e direção visual conectados em uma única linguagem.</p>', '<p>Studio de design gráfico em Curitiba: design, motion, 3D, web e direção visual conectados em uma única linguagem.</p>', 1),
              ('<a href="curitiba/" style="color:inherit;text-decoration:none">Estúdio criativo em Curitiba</a>', '<a href="curitiba/" style="color:inherit;text-decoration:none">Studio de design gráfico em Curitiba</a>', 1),
          ])

          patch('curitiba/index.html', [
              ('<title>Estúdio de Design e Estúdio Criativo em Curitiba | Mensagem Studio</title>', '<title>Studio de Design Gráfico em Curitiba | Mensagem Studio</title>', 1),
              ('<meta name="description" content="Estúdio de design e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, design gráfico, vídeo, motion/VFX, IA, 3D/CGI e web.">', '<meta name="description" content="Studio de design gráfico e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion/VFX, IA, 3D/CGI e web.">', 1),
              ('<meta property="og:title" content="Estúdio de Design e Estúdio Criativo em Curitiba | Mensagem Studio">', '<meta property="og:title" content="Studio de Design Gráfico em Curitiba | Mensagem Studio">', 1),
              ('<meta property="og:description" content="Estúdio de design e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, design gráfico, vídeo, motion/VFX, IA, 3D/CGI e web.">', '<meta property="og:description" content="Studio de design gráfico e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion/VFX, IA, 3D/CGI e web.">', 1),
              ('<meta property="og:image:alt" content="Mensagem Studio — estúdio criativo em Curitiba">', '<meta property="og:image:alt" content="Mensagem Studio — studio de design gráfico em Curitiba">', 1),
              ('<meta name="twitter:title" content="Estúdio de Design e Estúdio Criativo em Curitiba | Mensagem Studio">', '<meta name="twitter:title" content="Studio de Design Gráfico em Curitiba | Mensagem Studio">', 1),
              ('<meta name="twitter:description" content="Estúdio de design e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, design gráfico, vídeo, motion/VFX, IA, 3D/CGI e web.">', '<meta name="twitter:description" content="Studio de design gráfico e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion/VFX, IA, 3D/CGI e web.">', 1),
              ('"description":"Estúdio de design e estúdio criativo em Curitiba com atuação em design gráfico, branding, direção de arte, audiovisual, motion, VFX, IA generativa, 3D/CGI e web."', '"description":"Studio de design gráfico e estúdio criativo em Curitiba com atuação em branding, direção de arte, audiovisual, motion, VFX, IA generativa, 3D/CGI e web."', 1),
              ('"name":"Estúdio de Design e Estúdio Criativo em Curitiba | Mensagem Studio"', '"name":"Studio de Design Gráfico em Curitiba | Mensagem Studio"', 1),
              ('"description":"Estúdio de design e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, design gráfico, vídeo, motion/VFX, IA, 3D/CGI e web."', '"description":"Studio de design gráfico e estúdio criativo em Curitiba para marcas e empresas: branding, direção de arte, vídeo, motion/VFX, IA, 3D/CGI e web."', 1),
              ('"name":"Estúdio Criativo em Curitiba","item":"https://mensagemstudio.shop/curitiba/"', '"name":"Studio de Design Gráfico em Curitiba","item":"https://mensagemstudio.shop/curitiba/"', 1),
              ('<div class="eyebrow">Estúdio de Design · Curitiba · Creative Studio</div><h1>Estúdio Criativo em Curitiba</h1>', '<div class="eyebrow">Studio de Design Gráfico · Curitiba · Creative Studio</div><h1>Studio de Design Gráfico em Curitiba</h1>', 1),
              ('<p class="lead">A MENSAGEM STUDIO é um estúdio de design em Curitiba para marcas e empresas, reunindo design gráfico, branding, direção de arte, audiovisual, motion/VFX, inteligência artificial generativa, modelagem 3D, CGI de produto e experiências web.</p>', '<p class="lead">A MENSAGEM STUDIO é um estúdio de design gráfico em Curitiba para marcas e empresas, reunindo branding, direção de arte, audiovisual, motion/VFX, inteligência artificial generativa, modelagem 3D, CGI de produto e experiências web.</p>', 1),
          ])
          PY

      - name: Commit SEO changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SEO changes required."
            exit 0
          fi
          git config user.name "Mensagem Studio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html curitiba/index.html
          git commit -m "SEO: reinforce studio de design gráfico em Curitiba"
          git push
