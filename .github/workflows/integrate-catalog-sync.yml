name: Integrate services and portfolio catalog

on:
  push:
    paths:
      - 'wix-preview/catalog-sync.js'
      - 'scripts/integrate_catalog_sync.py'
      - '.github/workflows/integrate-catalog-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate catalog script
        run: python scripts/integrate_catalog_sync.py
      - name: Verify integration
        run: |
          grep -q 'catalog-sync.js' wix-preview/index.html
          grep -q 'Projetos do Mensagem Studio' wix-preview/catalog-sync.js
          grep -q 'Da ideia ao resultado' wix-preview/catalog-sync.js
      - name: Commit generated preview change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wix-preview/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate services catalog and public portfolio'
          git push
