name: Sync PREVIEW Backup

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - '404/**'
      - '*.js'
      - '*.txt'
      - '.nojekyll'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'assets/**'
      - 'preview-21st-shader/dist/**'
      - '.github/workflows/publish-new-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild wix-preview from production
        shell: bash
        run: |
          set -euo pipefail

          # Recreate the backup from scratch. Explicitly whitelisted preview
          # overlays are re-applied after the production mirror is rebuilt.
          rm -rf wix-preview
          mkdir -p wix-preview

          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='wix-preview/'             --exclude='scripts/'             --exclude='docs/'             --exclude='review-priority6/'             --exclude='preview-21st-shader/'             --exclude='preview-*.html'             --exclude='CNAME'             ./ wix-preview/

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("wix-preview")

          # Keep global navigation inside the backup tree.
          gui = root / "global-ui.js"
          if gui.exists():
              text = gui.read_text(encoding="utf-8")
              text = text.replace("const ROOT = '/';", "const ROOT = '/wix-preview/';")
              gui.write_text(text, encoding="utf-8")

          # Preview HTML should mirror production content while remaining
          # excluded from indexing. Do NOT rewrite relative asset/script paths:
          # the mirrored directory structure already resolves them correctly.
          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )

              if 'name="robots"' not in text.lower():
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              if 'name="ms-backup-source"' not in text:
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="ms-backup-source" content="production-mirror">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              # Repair legacy duplicated paths without touching correct relative refs.
              text = text.replace('./wix-preview/global-ui.js', './global-ui.js')
              text = text.replace('../wix-preview/global-ui.js', '../global-ui.js')
              text = text.replace('../../wix-preview/global-ui.js', '../../global-ui.js')

              # Root-absolute references must stay inside the backup tree.
              text = text.replace('src="/global-ui.js', 'src="/wix-preview/global-ui.js')
              text = text.replace("src='/global-ui.js", "src='/wix-preview/global-ui.js")

              path.write_text(text, encoding="utf-8")

          # Re-apply the supplied 21st.dev Mesh drift shader to PREVIEW only.
          shader_dist = Path("preview-21st-shader/dist")
          portfolio_index = root / "portfolio" / "index.html"
          shader_dst = root / "portfolio" / "shader-21st"

          if shader_dist.exists() and portfolio_index.exists():
              import shutil

              if shader_dst.exists():
                  shutil.rmtree(shader_dst)
              shutil.copytree(shader_dist, shader_dst)

              text = portfolio_index.read_text(encoding="utf-8")

              # Remove the previous preview aurora implementation.
              text = re.sub(
                  r'<link[^>]+href=["\']\./projects-aurora\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script[^>]+src=["\']\./projects-aurora\.js(?:\?[^"\']*)?["\'][^>]*><\/script>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              # Normalize the 21st shader asset tags on every rebuild.
              text = re.sub(
                  r'<link[^>]+href=["\']\./shader-21st/shader-background\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script[^>]+src=["\']\./shader-21st/shader-background\.js(?:\?[^"\']*)?["\'][^>]*><\/script>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              css_tag = '<link rel="stylesheet" href="./shader-21st/shader-background.css?v=20260920-21st-mesh-drift-v1">'
              script_tag = '<script type="module" src="./shader-21st/shader-background.js?v=20260920-21st-mesh-drift-v1"></script>'

              text = text.replace('</head>', css_tag + '\n</head>', 1)

              anchor = '<script src="./project-data.js'
              pos = text.find(anchor)
              if pos >= 0:
                  text = text[:pos] + script_tag + '\n' + text[pos:]
              else:
                  text = text.replace('</body>', script_tag + '\n</body>', 1)

              portfolio_index.write_text(text, encoding="utf-8")
          PY

      - name: Commit backup snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A wix-preview
          if git diff --cached --quiet; then
            echo 'Preview backup already matches production.'
            exit 0
          fi
          git commit -m 'Sync wix-preview backup from production'
          git pull --rebase origin main
          git push
