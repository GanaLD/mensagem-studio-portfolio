name: Sync PREVIEW Backup

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'catalog-sync.js'
      - 'global-ui.js'
      - 'home-round2.js'
      - 'home-round2d.js'
      - 'home-runtime.js'
      - 'pdf-click-viewer.js'
      - 'scroll-reveal.js'
      - 'services-cart-suggestions.js'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror production into wix-preview backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p wix-preview
          cp index.html wix-preview/index.html
          cp catalog-sync.js wix-preview/catalog-sync.js
          cp global-ui.js wix-preview/global-ui.js
          cp home-round2.js wix-preview/home-round2.js
          cp home-round2d.js wix-preview/home-round2d.js
          cp home-runtime.js wix-preview/home-runtime.js
          cp pdf-click-viewer.js wix-preview/pdf-click-viewer.js
          cp scroll-reveal.js wix-preview/scroll-reveal.js
          cp services-cart-suggestions.js wix-preview/services-cart-suggestions.js

          rm -rf wix-preview/portfolio wix-preview/servicos wix-preview/sobre
          cp -a portfolio wix-preview/portfolio
          cp -a servicos wix-preview/servicos
          cp -a sobre wix-preview/sobre

          rm -rf wix-preview/assets
          cp -a assets wix-preview/assets

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("wix-preview")

          # Backup navigation stays inside the backup tree.
          gui = root / "global-ui.js"
          if gui.exists():
              text = gui.read_text(encoding="utf-8")
              text = text.replace("const ROOT = '/';", "const ROOT = '/wix-preview/';")
              gui.write_text(text, encoding="utf-8")

          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )
              if 'name="robots"' not in text.lower():
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )
              if 'name="ms-backup-source"' not in text:
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="ms-backup-source" content="production-mirror">',
                      text,
                      count=1,
                      flags=re.I,
                  )
              text = re.sub(
                  r'/global-ui\.js\?v=([^"\']+)',
                  r'/wix-preview/global-ui.js?v=\1',
                  text
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit backup snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wix-preview
          if git diff --cached --quiet; then
            echo 'Preview backup already matches production.'
            exit 0
          fi
          git commit -m 'Sync wix-preview backup from production'
          git push
