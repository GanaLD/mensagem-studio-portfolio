name: Publish NOVO SITE

on:
  push:
    branches:
      - main
    paths:
      - 'wix-preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-novo-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote wix-preview to public root
        shell: bash
        run: |
          set -euo pipefail
          cp wix-preview/index.html index.html
          cp wix-preview/catalog-sync.js catalog-sync.js
          cp wix-preview/global-ui.js global-ui.js
          cp wix-preview/home-round2.js home-round2.js
          cp wix-preview/home-round2d.js home-round2d.js
          cp wix-preview/home-runtime.js home-runtime.js
          cp wix-preview/pdf-click-viewer.js pdf-click-viewer.js
          cp wix-preview/scroll-reveal.js scroll-reveal.js
          cp wix-preview/services-cart-suggestions.js services-cart-suggestions.js

          rm -rf portfolio servicos sobre
          cp -a wix-preview/portfolio portfolio
          cp -a wix-preview/servicos servicos
          cp -a wix-preview/sobre sobre

          mkdir -p assets
          cp -a wix-preview/assets/. assets/

          rm -rf projetos clientes contato orcamento busca arquivo briefing

      - name: Commit public build
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A index.html catalog-sync.js global-ui.js home-round2.js home-round2d.js home-runtime.js pdf-click-viewer.js scroll-reveal.js services-cart-suggestions.js assets portfolio servicos sobre projetos clientes contato orcamento busca arquivo briefing
          if git diff --cached --quiet; then
            echo 'Public root already matches NOVO SITE.'
            exit 0
          fi
          git commit -m 'Publish NOVO SITE from wix-preview'
          git push
