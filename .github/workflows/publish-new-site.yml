name: Sync PREVIEW Backup

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - '404/**'
      - '*.js'
      - '*.txt'
      - '.nojekyll'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'assets/**'
      - '.github/workflows/publish-new-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild wix-preview from production
        shell: bash
        run: |
          set -euo pipefail

          # Recreate the backup from scratch. Explicitly whitelisted preview
          # overlays are re-applied after the production mirror is rebuilt.
          rm -rf wix-preview
          mkdir -p wix-preview

          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='wix-preview/'             --exclude='scripts/'             --exclude='docs/'             --exclude='review-priority6/'             --exclude='preview-*.html'             --exclude='CNAME'             ./ wix-preview/

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("wix-preview")

          # Keep global navigation inside the backup tree.
          gui = root / "global-ui.js"
          if gui.exists():
              text = gui.read_text(encoding="utf-8")
              text = text.replace("const ROOT = '/';", "const ROOT = '/wix-preview/';")
              gui.write_text(text, encoding="utf-8")

          # Preview HTML should mirror production content while remaining
          # excluded from indexing. Do NOT rewrite relative asset/script paths:
          # the mirrored directory structure already resolves them correctly.
          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )

              if 'name="robots"' not in text.lower():
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              if 'name="ms-backup-source"' not in text:
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="ms-backup-source" content="production-mirror">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              # Repair legacy duplicated paths without touching correct relative refs.
              text = text.replace('./wix-preview/global-ui.js', './global-ui.js')
              text = text.replace('../wix-preview/global-ui.js', '../global-ui.js')
              text = text.replace('../../wix-preview/global-ui.js', '../../global-ui.js')

              # Root-absolute references must stay inside the backup tree.
              text = text.replace('src="/global-ui.js', 'src="/wix-preview/global-ui.js')
              text = text.replace("src='/global-ui.js", "src='/wix-preview/global-ui.js")

              path.write_text(text, encoding="utf-8")

          # Re-apply the explicit Projects aurora experiment to PREVIEW only.
          aurora_js_src = Path("scripts/preview-projects-aurora.js")
          aurora_css_src = Path("scripts/preview-projects-aurora.css")
          portfolio_index = root / "portfolio" / "index.html"
          aurora_js_dst = root / "portfolio" / "projects-aurora.js"
          aurora_css_dst = root / "portfolio" / "projects-aurora.css"

          if aurora_js_src.exists() and aurora_css_src.exists() and portfolio_index.exists():
              aurora_js_dst.write_text(aurora_js_src.read_text(encoding="utf-8"), encoding="utf-8")
              aurora_css_dst.write_text(aurora_css_src.read_text(encoding="utf-8"), encoding="utf-8")

              text = portfolio_index.read_text(encoding="utf-8")
              css_tag = '<link rel="stylesheet" href="./projects-aurora.css?v=20260919-preview-reference-aurora-v8">'
              script_tag = '<script src="./projects-aurora.js?v=20260919-preview-reference-aurora-v8"></script>'

              def version_asset(source, asset, version):
                  pos = source.find(asset)
                  if pos < 0:
                      return source
                  end = pos + len(asset)
                  if source.startswith('?v=', end):
                      qend = end
                      while qend < len(source) and source[qend] not in ('"', "'"):
                          qend += 1
                      return source[:end] + '?v=' + version + source[qend:]
                  return source[:end] + '?v=' + version + source[end:]

              if './projects-aurora.css' in text:
                  text = version_asset(
                      text,
                      './projects-aurora.css',
                      '20260919-preview-reference-aurora-v8',
                  )
              else:
                  text = text.replace('</head>', css_tag + '\n</head>', 1)

              if './projects-aurora.js' in text:
                  text = version_asset(
                      text,
                      './projects-aurora.js',
                      '20260919-preview-reference-aurora-v8',
                  )
              else:
                  anchor = '<script src="./project-data.js'
                  pos = text.find(anchor)
                  if pos >= 0:
                      text = text[:pos] + script_tag + '\n' + text[pos:]
                  else:
                      text = text.replace('</body>', script_tag + '\n</body>', 1)

              portfolio_index.write_text(text, encoding="utf-8")

          # Re-apply the supplied token-filter experiment to PREVIEW only.
          filter_js_src = Path("scripts/preview-filter-token-bar.js")
          filter_css_src = Path("scripts/preview-filter-token-bar.css")
          filter_js_dst = root / "portfolio" / "filter-token-bar.js"
          filter_css_dst = root / "portfolio" / "filter-token-bar.css"

          if filter_js_src.exists() and filter_css_src.exists() and portfolio_index.exists():
              filter_js_dst.write_text(filter_js_src.read_text(encoding="utf-8"), encoding="utf-8")
              filter_css_dst.write_text(filter_css_src.read_text(encoding="utf-8"), encoding="utf-8")

              text = portfolio_index.read_text(encoding="utf-8")
              filter_css_tag = '<link rel="stylesheet" href="./filter-token-bar.css?v=20260919-preview-filter-token-v1">'
              filter_script_tag = '<script src="./filter-token-bar.js?v=20260919-preview-filter-token-v1"></script>'

              def version_filter_asset(source, asset, version):
                  pos = source.find(asset)
                  if pos < 0:
                      return source
                  end = pos + len(asset)
                  if source.startswith('?v=', end):
                      qend = end
                      while qend < len(source) and source[qend] not in ('"', "'"):
                          qend += 1
                      return source[:end] + '?v=' + version + source[qend:]
                  return source[:end] + '?v=' + version + source[end:]

              if './filter-token-bar.css' in text:
                  text = version_filter_asset(
                      text,
                      './filter-token-bar.css',
                      '20260919-preview-filter-token-v1',
                  )
              else:
                  text = text.replace('</head>', filter_css_tag + '\n</head>', 1)

              if './filter-token-bar.js' in text:
                  text = version_filter_asset(
                      text,
                      './filter-token-bar.js',
                      '20260919-preview-filter-token-v1',
                  )
              else:
                  anchor = '<script src="./projects-aurora.js'
                  pos = text.find(anchor)
                  if pos >= 0:
                      text = text[:pos] + filter_script_tag + '\n' + text[pos:]
                  else:
                      text = text.replace('</body>', filter_script_tag + '\n</body>', 1)

              portfolio_index.write_text(text, encoding="utf-8")
          PY

      - name: Commit backup snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A wix-preview
          if git diff --cached --quiet; then
            echo 'Preview backup already matches production.'
            exit 0
          fi
          git commit -m 'Sync wix-preview backup from production'
          git pull --rebase origin main
          git push
