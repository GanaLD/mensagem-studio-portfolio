name: Sync PREVIEW Backup

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - '404/**'
      - '*.js'
      - '*.txt'
      - '.nojekyll'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'assets/**'
      - '.github/workflows/publish-new-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild wix-preview from production
        shell: bash
        run: |
          set -euo pipefail

          rm -rf wix-preview
          mkdir -p wix-preview

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='wix-preview/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='review-priority6/' \
            --exclude='preview-21st-shader/' \
            --exclude='preview-*.html' \
            --exclude='CNAME' \
            ./ wix-preview/

          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("wix-preview")

          gui = root / "global-ui.js"
          if gui.exists():
              text = gui.read_text(encoding="utf-8")
              text = text.replace("const ROOT = '/';", "const ROOT = '/wix-preview/';")
              gui.write_text(text, encoding="utf-8")

          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8")

              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )

              if 'name="robots"' not in text.lower():
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              if 'name="ms-backup-source"' not in text:
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="ms-backup-source" content="production-mirror">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              text = text.replace('./wix-preview/global-ui.js', './global-ui.js')
              text = text.replace('../wix-preview/global-ui.js', '../global-ui.js')
              text = text.replace('../../wix-preview/global-ui.js', '../../global-ui.js')
              text = text.replace('src="/global-ui.js', 'src="/wix-preview/global-ui.js')
              text = text.replace("src='/global-ui.js", "src='/wix-preview/global-ui.js")

              html.write_text(text, encoding="utf-8")

          # PREVIEW-only React Bits BorderGlow test on the HOME service cards.
          dist = Path("preview-21st-shader/dist")
          target = root / "react-bits-border-glow"
          home_index = root / "index.html"

          js = dist / "border-glow-service-cards.js"
          css = dist / "border-glow-service-cards.css"

          if not js.exists() or not css.exists():
              raise SystemExit("BorderGlow preview bundle is missing from preview-21st-shader/dist")

          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(js, target / js.name)
          shutil.copy2(css, target / css.name)

          text = home_index.read_text(encoding="utf-8")

          # Remove older preview-only attempts before inserting the real component bundle.
          text = re.sub(
              r'<link[^>]+href=["\']\./react-bits-border-glow/border-glow-service-cards\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
              '',
              text,
              flags=re.I,
          )
          text = re.sub(
              r'<script[^>]+src=["\']\./react-bits-border-glow/border-glow-service-cards\.js(?:\?[^"\']*)?["\'][^>]*><\/script>\s*',
              '',
              text,
              flags=re.I,
          )

          css_tag = '<link rel="stylesheet" href="./react-bits-border-glow/border-glow-service-cards.css?v=20260920-react-bits-border-glow-v2">'
          js_tag = '<script type="module" src="./react-bits-border-glow/border-glow-service-cards.js?v=20260920-react-bits-border-glow-v2"></script>'

          text = text.replace('</head>', css_tag + '\n</head>', 1)

          runtime_match = re.search(
              r'<script src="\./home-runtime\.js\?v=[^"]+"></script>',
              text,
              flags=re.I,
          )
          if runtime_match:
              pos = runtime_match.end()
              text = text[:pos] + '\n' + js_tag + text[pos:]
          else:
              text = text.replace('</body>', js_tag + '\n</body>', 1)

          home_index.write_text(text, encoding="utf-8")

          # PREVIEW-only React Bits RubberSegment test on the Services category rail.
          rubber_dist = Path("preview-21st-shader/dist-rubber")
          rubber_target = root / "servicos" / "react-bits-rubber-segment"
          services_index = root / "servicos" / "index.html"

          rubber_js = rubber_dist / "rubber-segment-services.js"
          rubber_css = rubber_dist / "rubber-segment-services.css"

          if not rubber_js.exists() or not rubber_css.exists():
              raise SystemExit("RubberSegment preview bundle is missing from preview-21st-shader/dist-rubber")

          if rubber_target.exists():
              shutil.rmtree(rubber_target)
          rubber_target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(rubber_js, rubber_target / rubber_js.name)
          shutil.copy2(rubber_css, rubber_target / rubber_css.name)

          if services_index.exists():
              text = services_index.read_text(encoding="utf-8")

              text = re.sub(
                  r'<link[^>]+href=["\']\./react-bits-rubber-segment/rubber-segment-services\.css(?:\?[^"\']*)?["\'][^>]*>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script[^>]+src=["\']\./react-bits-rubber-segment/rubber-segment-services\.js(?:\?[^"\']*)?["\'][^>]*><\/script>\s*',
                  '',
                  text,
                  flags=re.I,
              )

              rubber_css_tag = '<link rel="stylesheet" href="./react-bits-rubber-segment/rubber-segment-services.css?v=20260920-rubber-segment-v1">'
              rubber_js_tag = '<script type="module" src="./react-bits-rubber-segment/rubber-segment-services.js?v=20260920-rubber-segment-v1"></script>'

              text = text.replace('</head>', rubber_css_tag + '\n</head>', 1)
              text = text.replace('</body>', rubber_js_tag + '\n</body>', 1)
              services_index.write_text(text, encoding="utf-8")

          # Portfolio remains LightRays-only. Never inject Plasma.
          portfolio_index = root / "portfolio" / "index.html"
          if portfolio_index.exists():
              text = portfolio_index.read_text(encoding="utf-8")
              text = re.sub(
                  r'<link[^>]+href=["\']\./plasma-react-bits/[^"\']+["\'][^>]*>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              text = re.sub(
                  r'<script[^>]+src=["\']\./plasma-react-bits/[^"\']+["\'][^>]*><\/script>\s*',
                  '',
                  text,
                  flags=re.I,
              )
              portfolio_index.write_text(text, encoding="utf-8")
          PY

      - name: Commit backup snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A wix-preview
          if git diff --cached --quiet; then
            echo 'Preview backup already matches production plus approved preview overlays.'
            exit 0
          fi
          git commit -m 'Sync wix-preview backup from production'
          git pull --rebase origin main
          git push
