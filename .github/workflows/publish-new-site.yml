name: Sync PREVIEW Backup

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '404.html'
      - '404/**'
      - '*.js'
      - '*.txt'
      - '.nojekyll'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'data/**'
      - 'portfolio/**'
      - 'servicos/**'
      - 'sobre/**'
      - 'assets/**'
      - '.github/workflows/publish-new-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview-backup
  cancel-in-progress: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild wix-preview from production
        shell: bash
        run: |
          set -euo pipefail

          # Recreate the backup from scratch. Explicitly whitelisted preview
          # overlays are re-applied after the production mirror is rebuilt.
          rm -rf wix-preview
          mkdir -p wix-preview

          rsync -a             --exclude='.git/'             --exclude='.github/'             --exclude='wix-preview/'             --exclude='scripts/'             --exclude='docs/'             --exclude='review-priority6/'             --exclude='preview-*.html'             --exclude='CNAME'             ./ wix-preview/

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("wix-preview")

          # Keep global navigation inside the backup tree.
          gui = root / "global-ui.js"
          if gui.exists():
              text = gui.read_text(encoding="utf-8")
              text = text.replace("const ROOT = '/';", "const ROOT = '/wix-preview/';")
              gui.write_text(text, encoding="utf-8")

          # Preview HTML should mirror production content while remaining
          # excluded from indexing. Do NOT rewrite relative asset/script paths:
          # the mirrored directory structure already resolves them correctly.
          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r'<meta name="robots" content="[^"]*">',
                  '<meta name="robots" content="noindex,follow">',
                  text,
                  count=1,
                  flags=re.I,
              )

              if 'name="robots"' not in text.lower():
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="robots" content="noindex,follow">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              if 'name="ms-backup-source"' not in text:
                  text = re.sub(
                      r'<head>',
                      '<head><meta name="ms-backup-source" content="production-mirror">',
                      text,
                      count=1,
                      flags=re.I,
                  )

              # Repair legacy duplicated paths without touching correct relative refs.
              text = text.replace('./wix-preview/global-ui.js', './global-ui.js')
              text = text.replace('../wix-preview/global-ui.js', '../global-ui.js')
              text = text.replace('../../wix-preview/global-ui.js', '../../global-ui.js')

              # Root-absolute references must stay inside the backup tree.
              text = text.replace('src="/global-ui.js', 'src="/wix-preview/global-ui.js')
              text = text.replace("src='/global-ui.js", "src='/wix-preview/global-ui.js")

              path.write_text(text, encoding="utf-8")

          # Re-apply the explicit Projects aurora experiment to PREVIEW only.
          aurora_src = Path("scripts/preview-projects-aurora.js")
          portfolio_index = root / "portfolio" / "index.html"
          aurora_dst = root / "portfolio" / "projects-aurora.js"

          if aurora_src.exists() and portfolio_index.exists():
              aurora_dst.write_text(aurora_src.read_text(encoding="utf-8"), encoding="utf-8")

              text = portfolio_index.read_text(encoding="utf-8")
              style = r'''<style id="projects-aurora-preview-v5">
/* PREVIEW ONLY — persistent midnight-blue animated aurora */
body{background:#020821!important}
main{background:#020821!important}
.projects-shader{
  background:
    radial-gradient(92% 76% at 16% 14%,rgba(16,54,138,.22) 0,rgba(5,23,70,.14) 43%,transparent 78%),
    radial-gradient(82% 66% at 84% 42%,rgba(31,88,170,.11) 0,rgba(7,28,76,.08) 48%,transparent 82%),
    linear-gradient(180deg,#020821 0%,#041538 52%,#020821 100%)!important;
}
.projects-shader::before,
.projects-shader::after{display:none!important}
.projects-aurora-canvas{
  position:absolute;
  top:0;
  left:0;
  z-index:0;
  display:block;
  width:100%;
  height:100svh;
  max-width:none;
  pointer-events:none;
  opacity:1;
  filter:saturate(1.08) contrast(1.03);
  will-change:transform;
  transform-origin:center center;
}
main>.wrap{position:relative;z-index:2}
@media(max-width:650px){
  body,main{background:#020821!important}
  .projects-shader{
    background:
      radial-gradient(96% 78% at 14% 16%,rgba(14,50,128,.22) 0,rgba(5,22,68,.13) 45%,transparent 80%),
      linear-gradient(180deg,#020821 0%,#041333 54%,#020821 100%)!important;
  }
}
</style>'''
              script_tag = '<script src="./projects-aurora.js?v=20260919-v5-midnight-motion"></script>'

              if 'projects-aurora-preview-v5' not in text:
                  text = text.replace('</head>', style + '\n</head>', 1)

              if './projects-aurora.js' not in text:
                  anchor = '<script src="./project-data.js'
                  pos = text.find(anchor)
                  if pos >= 0:
                      text = text[:pos] + script_tag + '\n' + text[pos:]
                  else:
                      text = text.replace('</body>', script_tag + '\n</body>', 1)

              portfolio_index.write_text(text, encoding="utf-8")
          PY

      - name: Commit backup snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A wix-preview
          if git diff --cached --quiet; then
            echo 'Preview backup already matches production.'
            exit 0
          fi
          git commit -m 'Sync wix-preview backup from production'
          git pull --rebase origin main
          git push
