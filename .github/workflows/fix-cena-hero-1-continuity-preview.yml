name: Remove rogue HERO 1 top-left instruction text

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-cena-hero-1-continuity-preview.yml'

permissions:
  contents: write

concurrency:
  group: remove-rogue-hero1-top-left-text
  cancel-in-progress: false

jobs:
  remove-rogue-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject targeted removal guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          marker = 'MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2'
          guard = r'''<style id="MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2_STYLE">
          [data-ms-rogue-pseudo-hidden="1"]::before,
          [data-ms-rogue-pseudo-hidden="1"]::after{content:none!important;display:none!important}
          </style>
          <script id="MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2">
          (()=>{
            if(window.__MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2__) return;
            window.__MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2__=true;
            const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
            const rogue=s=>{
              const t=norm(s);
              return t.includes('depois entram os cases') ||
                     (t.includes('filme') && t.includes('cases')) ||
                     (t.includes('controlar') && t.includes('filme') && t.length<220);
            };
            const cleanRoot=root=>{
              if(!root) return;
              try{
                const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
                const victims=[];
                let n;
                while((n=walker.nextNode())){
                  const p=n.parentElement;
                  if(!p || ['SCRIPT','STYLE','NOSCRIPT','TEXTAREA'].includes(p.tagName)) continue;
                  if(rogue(n.nodeValue)) victims.push(n);
                }
                victims.forEach(n=>{n.nodeValue='';});
              }catch(_){}

              let els=[];
              try{els=[...root.querySelectorAll('*')];}catch(_){}
              for(let i=els.length-1;i>=0;i--){
                const el=els[i];
                if(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA'].includes(el.tagName)) continue;
                let before='',after='';
                try{
                  before=getComputedStyle(el,'::before').content||'';
                  after=getComputedStyle(el,'::after').content||'';
                }catch(_){}
                if(rogue(before)||rogue(after)){
                  el.setAttribute('data-ms-rogue-pseudo-hidden','1');
                }
                const full=el.textContent||'';
                if(!rogue(full)) continue;
                const childHas=[...el.children].some(c=>rogue(c.textContent||''));
                if(childHas) continue;
                let r=null;
                try{r=el.getBoundingClientRect();}catch(_){}
                const smallTopLeft=!r || (
                  r.top<220 && r.left<520 && r.bottom>-20 &&
                  r.width<1000 && r.height<180
                );
                if(smallTopLeft || norm(full).length<220){
                  el.style.setProperty('display','none','important');
                  el.setAttribute('data-ms-rogue-text-hidden','1');
                }
              }
            };
            const clean=()=>cleanRoot(document.body||document.documentElement);
            const run=()=>{
              clean();
              requestAnimationFrame(clean);
              setTimeout(clean,100);
              setTimeout(clean,500);
              setTimeout(clean,1500);
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run,{once:true});
            else run();
            try{
              new MutationObserver(clean).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
            }catch(_){}
          })();
          </script>'''

          targets = [
              Path('index.html'),
              Path('wix-preview/index.html'),
              Path('assets/cena-hero-1/visualizador.html'),
              Path('wix-preview/assets/cena-hero-1/visualizador.html'),
          ]

          changed = []
          for p in targets:
              if not p.exists():
                  raise SystemExit(f'Missing expected target: {p}')
              html = p.read_text(encoding='utf-8')
              if marker in html:
                  continue
              if '</body>' in html:
                  html = html.replace('</body>', guard + '\n</body>', 1)
              elif '</head>' in html:
                  html = html.replace('</head>', guard + '\n</head>', 1)
              else:
                  html = html + '\n' + guard
              p.write_text(html, encoding='utf-8')
              changed.append(str(p))

          print('Patched:', ', '.join(changed) if changed else 'already patched')
          PY

      - name: Verify targeted guard exists everywhere
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html \
            wix-preview/index.html \
            assets/cena-hero-1/visualizador.html \
            wix-preview/assets/cena-hero-1/visualizador.html
          do
            grep -q 'MS_REMOVE_ROGUE_HERO1_TOP_LEFT_TEXT_V2' "$f"
            grep -q 'depois entram os cases' "$f"
          done

      - name: Publish real text removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html wix-preview/index.html assets/cena-hero-1/visualizador.html wix-preview/assets/cena-hero-1/visualizador.html
          if git diff --cached --quiet; then
            echo 'Targeted removal guard already present.'
            exit 0
          fi
          git commit -m 'Remove rogue HERO 1 top-left instruction text [skip ci]'
          git push
