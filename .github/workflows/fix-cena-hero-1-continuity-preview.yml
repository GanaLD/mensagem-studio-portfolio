name: Hide CENA HERO 1 instruction overlay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-cena-hero-1-continuity-preview.yml'

permissions:
  contents: write

concurrency:
  group: hide-cena-hero-1-instruction-overlay
  cancel-in-progress: false

jobs:
  hide-hint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only the top-left instruction overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('assets/cena-hero-1/visualizador.html'),
              Path('wix-preview/assets/cena-hero-1/visualizador.html'),
          ]

          for p in targets:
              if not p.exists():
                  raise SystemExit(f'Missing expected viewer: {p}')

              html = p.read_text(encoding='utf-8')

              # This is the small top-left debug/instruction label inside the HERO 1 iframe.
              # Keep the approved central mouse/scroll cue untouched.
              if re.search(r'#hint\s*\{[^}]*\}', html):
                  html = re.sub(
                      r'#hint\s*\{[^}]*\}',
                      '#hint{display:none!important}',
                      html,
                      count=1,
                  )
              elif 'id="hint"' in html or "id='hint'" in html:
                  marker = '<style id="MS_HIDE_TOP_LEFT_HINT">#hint{display:none!important}</style>'
                  if marker not in html:
                      if '</head>' in html:
                          html = html.replace('</head>', marker + '\n</head>', 1)
                      else:
                          html = marker + '\n' + html
              else:
                  raise SystemExit(f'#hint overlay not found in {p}')

              p.write_text(html, encoding='utf-8')
          PY

      - name: Verify overlay is hidden in production and preview
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#hint{display:none!important}' assets/cena-hero-1/visualizador.html
          grep -q '#hint{display:none!important}' wix-preview/assets/cena-hero-1/visualizador.html

      - name: Publish overlay removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cena-hero-1/visualizador.html wix-preview/assets/cena-hero-1/visualizador.html
          if git diff --cached --quiet; then
            echo 'Overlay already hidden.'
            exit 0
          fi
          git commit -m 'Remove top-left HERO 1 instruction overlay [skip ci]'
          git push
