name: Validar preview SEO e navegação
on:
  push:
    branches: [qa/seo-20261116]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            qa-seo
          persist-credentials: false
      - run: python -m pip install playwright==1.51.0
      - run: python qa-seo/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-cinco-larguras
          path: evidence/
          retention-days: 7
