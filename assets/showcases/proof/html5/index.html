<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudioFrame HTML5 Proof</title><style>html,body{margin:0;height:100%;font:16px system-ui;background:#0f1117;color:#f8f8f5}main{height:100%;display:grid;place-items:center;overflow:hidden}.card{width:min(760px,84vw);padding:42px;border:1px solid #34394a;border-radius:28px;background:#171a23;box-shadow:0 30px 90px #0007}.orb{width:92px;height:92px;border-radius:50%;background:#68f2a5;box-shadow:0 0 70px #68f2a588;transition:transform .25s}.row{display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}small{color:#aab2c8}</style></head><body><main><article class="card"><div class="orb" id="orb"></div><h1>HTML5 Showcase</h1><p>Conteúdo interativo real, isolado em iframe sandbox.</p><div class="row"><button id="move">Mover objeto</button><button id="reset">Reset</button></div><p><small id="status">READY</small></p></article></main><script>const o=document.querySelector('#orb'),s=document.querySelector('#status');document.querySelector('#move').onclick=()=>{o.style.transform='translateX(220px) rotate(180deg)';s.textContent='INTERACTION_OK';parent.postMessage({type:'studioframe-showcase-health',owner:'studio.html5',state:'READY'},'*')};document.querySelector('#reset').onclick=()=>{o.style.transform='';s.textContent='READY'};parent.postMessage({type:'studioframe-showcase-health',owner:'studio.html5',state:'READY'},'*')</script></body></html>
