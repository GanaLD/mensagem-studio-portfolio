<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Mensagem Studio | Portfólio</title><style>
:root{--accent:#2FD59A;--bg:#070707;--panel:#101010;--text:#f5f5f1;--muted:#9d9d98;--line:#262626;--display:"Gotham","Gotham SSm","Futura PT","Futura","Montserrat","Century Gothic",Arial,sans-serif;--body:"Gotham","Futura","Montserrat",Arial,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow-x:hidden}button,a{color:inherit}.progress{position:fixed;left:0;top:0;width:100%;height:2px;z-index:100;transform-origin:left;background:var(--accent);transform:scaleX(0)}header{position:fixed;inset:0 0 auto;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid transparent;transition:.4s}header.is-scrolled{background:rgba(7,7,7,.86);backdrop-filter:blur(18px);border-color:var(--line)}.logo{font:500 12px var(--display);letter-spacing:.16em}.menu{border:1px solid var(--line);background:#111;border-radius:999px;padding:9px 13px;font-size:8px;text-transform:uppercase;letter-spacing:.1em}.hero{min-height:100vh;display:grid;align-content:end;padding:120px 4vw 7vh;position:relative;overflow:hidden}.hero::before{content:"";position:absolute;width:55vw;height:55vw;right:-15vw;top:-20vw;border-radius:50%;background:radial-gradient(circle,rgba(47,213,154,.18),transparent 68%)}.hero-kicker{position:absolute;left:4vw;top:120px;color:var(--accent);font-size:8px;letter-spacing:.2em;text-transform:uppercase}.hero h1{position:relative;z-index:1;margin:0;max-width:1100px;font:400 clamp(54px,10vw,150px)/.83 var(--display);letter-spacing:-.07em}.hero-copy{position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(260px,430px);gap:40px;margin-top:38px;border-top:1px solid var(--line);padding-top:20px}.hero-copy p{grid-column:2;margin:0;color:var(--muted);font-size:13px;line-height:1.65}.scroll-cue{position:absolute;right:4vw;bottom:4vh;color:var(--muted);font-size:7px;letter-spacing:.12em;text-transform:uppercase}.intro{padding:12vh 4vw 7vh;display:grid;grid-template-columns:minmax(220px,.6fr) 1.4fr;gap:7vw}.intro small{color:var(--accent);letter-spacing:.15em;text-transform:uppercase}.intro p{margin:0;font:400 clamp(28px,4vw,62px)/1.02 var(--display);letter-spacing:-.045em}.filters{position:sticky;top:72px;z-index:30;display:flex;gap:7px;overflow:auto;padding:14px 4vw;background:rgba(7,7,7,.92);border-block:1px solid var(--line);backdrop-filter:blur(18px)}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#111;padding:10px 13px;font-size:8px}.filter.is-active{background:var(--accent);border-color:var(--accent);color:#07130e}.projects{padding:5vh 4vw 14vh}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 4;border:0;background:transparent;padding:0;text-align:left}.card:nth-child(5n+1){grid-column:span 7}.card:nth-child(5n+2){grid-column:span 5}.media{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:#121212;clip-path:inset(var(--clip,0) round 2px)}.media img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.75,.25,1),opacity .3s}.card:hover img{transform:scale(1.035)}.type{position:absolute;left:12px;top:12px;border-radius:999px;background:rgba(0,0,0,.7);padding:6px 8px;font-size:7px;text-transform:uppercase}.copy{display:flex;justify-content:space-between;gap:20px;padding:13px 0 30px}.copy h3{margin:0;font:400 clamp(18px,2vw,30px)/1 var(--display);letter-spacing:-.035em}.copy p{margin:8px 0 0;color:var(--muted);font-size:9px;line-height:1.5}.copy em{font-style:normal;color:var(--accent);font-size:8px}.empty{padding:80px 0;color:var(--muted);text-align:center}.reveal{will-change:opacity,transform,filter;opacity:0;transform:translate3d(0,42px,0) scale(.985);filter:blur(6px)}.lightbox{position:fixed;inset:0;z-index:200;display:none;grid-template-rows:64px 1fr;background:rgba(0,0,0,.94);backdrop-filter:blur(16px)}.lightbox.open{display:grid}.lightbox-head </style></head><body><div class="progress" id="progress"></div><header id="header"><div class="logo" id="logo">MENSAGEM STUDIO</div><button class="menu" id="menu">Projetos</button></header><main><section class="hero"><div class="hero-kicker">Portfólio · Direção criativa</div><h1 id="heroTitle">Portfólio</h1><div class="hero-copy" id="heroCopy"><span></span><p id="heroDescription"></p></div><div class="scroll-cue" id="scrollCue">Role para explorar</div></section><section class="intro reveal"><small>Mensagem Studio</small><p id="heroLine"></p></section><nav class="filters" id="filters"></nav><section class="projects" id="projects"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Nenhum projeto visível nesta categoria.</div></section></main><footer><span id="footerName">Mensagem Studio</span><span>Conteúdo carregado do Google Drive</span></footer><div class="lightbox" id="lightbox" aria-hidden="true"><div class="lightbox-head"><strong id="lightboxTitle"></strong><button id="close" aria-label="Fechar">×</button></div><div class="stage" id="stage"></div></div><script>
(async function(){const DATA = (typeof null !== 'undefined' && null) ? null : await (await fetch('data/portfolio.json').then(r=>r.ok? r.json(): Promise.reject('Falha ao carregar data/portfolio.json'))).catch(e=>({identity:{},catalog:{root:{children:[]},stats:{}}})); const identity=DATA.identity||{};document.documentElement.style.setProperty('--accent',identity.accent_color||'#2FD59A');document.title=`${identity.studio_name||'Mensagem Studio'} | ${identity.portfolio_title||'Portfólio'}`;logo.textContent=identity.studio_name||'MENSAGEM STUDIO';footerName.textContent=identity.studio_name||'MENSAGEM STUDIO';heroTitle.textContent=identity.portfolio_title||'Portfólio';heroDescription.textContent=identity.description||'';heroLine.textContent=identity.hero_line||'';
const categories=[];const projects=[];function flatten(nodes,path=[]){nodes.forEach(n=>{if(n.type==='folder'){const c={id:n.id,title:n.title,path:[...path,n.title]};if(path.length===0)categories.push(c);flatten(n.children||[],c.path)}else projects.push({...n,categoryId:path[0]||'',categoryTitle:path[0]||'',path})})}flatten(DATA.catalog?.root?.children||[]);const idByTitle=new Map(categories.map(c=>[c.title,c.id]));projects.forEach(p=>p.categoryId=idByTitle.get(p.categoryId)||categories.find(c=>c.title===p.categoryTitle)?.id||'all');
function button(label,id){const b=document.createElement('button');b.className='filter';b.textContent=label;b.dataset.id=id;b.addEventListener('click',()=>select(id));return b}filters.append(button('Todos','all'));categories.forEach(c=>filters.append(button(c.title,c.id)));
function select(id){[...filters.children].forEach(b=>b.classList.toggle('is-active',b.dataset.id===id));grid.replaceChildren();const list=projects.filter(p=>id==='all'||p.categoryId===id);empty.hidden=!!list.length;list.forEach((p,i)=>{const b=document.createElement('button');b.className='card reveal';b.innerHTML='<span class="media"><img loading="lazy" decoding="async"><span class="type"></span></span><span class="copy"><span><h3></h3><p></p></span><em></em></span>';const img=b.querySelector('img');img.src=p.display_url;img.alt=p.title;img.addEventListener('error',()=>{img.style.opacity='.25';b.querySelector('.type').textContent='Mídia indisponível'},{once:true});b.querySelector('.type').textContent={image:'Imagem',video:'Vídeo',pdf:'PDF'}[p.type]||'Projeto';b.querySelector('h3').textContent=p.title;b.querySelector('p').textContent=p.description||p.path?.join(' · ')||'';b.querySelector('em').textContent=String(i+1).padStart(2,'0');b.addEventListener('click',()=>openMedia(p));grid.append(b)});bindReveal();tick()}function openMedia(p){stage.replaceChildren();lightboxTitle.textContent=p.title;let m;if(p.type==='image'){m=document.createElement('img');m.src=p.preview_url;m.alt=p.title}else if(p.type==='video'&&DATA.mode==='editor'){m=document.createElement('video');m.src=p.preview_url;m.controls=true;m.autoplay=true;m.playsInline=true}else{m=document.createElement('iframe');m.src=p.preview_url;m.title=p.title;m.allow='autoplay; fullscreen'}stage.append(m);lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false')}function closeMedia(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');stage.replaceChildren()}close.addEventListener('click',closeMedia);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeMedia()});addEventListener('keydown',e=>{if(e.key==='Escape')closeMedia()});menu.addEventListener('click',()=>projectsEl.scrollIntoView({behavior:reduced?'auto':'smooth'}));const projectsEl=document.getElementById('projects');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let nodes=[],queued=false;function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}function bindReveal(){nodes=[...document.querySelectorAll('.reveal')];if(reduced)nodes.forEach(n=>{n.style.opacity=1;n.style.transform='none';n.style.filter='none'})}function motion(){queued=false;const y=scrollY,h=innerHeight,max=Math.max(1,document.documentElement.scrollHeight-h);progress.style.transform=`scaleX(${clamp(y/max)})`;header.classList.toggle('is-scrolled',y>18);if(reduced)return;const hp=clamp(y/(h*.9));heroTitle.style.transform=`translate3d(0,${-y*.17}px,0) scale(${1-hp*.025})`;heroTitle.style.opacity=String(1-hp*.92);heroTitle.style.filter=`blur(${hp*5}px)`;heroCopy.style.transform=`translate3d(0,${-y*.09}px,0)`;heroCopy.style.opacity=String(1-hp*.8);scrollCue.style.opacity=String(1-hp*1.5);nodes.forEach(n=>{const r=n.getBoundingClientRect(),enter=clamp((h-r.top)/(h*.46)),leave=clamp(r.bottom/(Math.min(r.height,h*.42)||1)),op=Math.min(enter,leave),tr=r.top>=h?42:r.bottom<=0?-32:(1-op)*18;n.style.opacity=String(op);n.style.transform=`translate3d(0,${tr}px,0) scale(${.985+op*.015})`;n.style.filter=`blur(${(1-op)*6}px)`;const media=n.querySelector?.('.media');if(media)media.style.setProperty('--clip',`${(1-op)*8}%`)})}function tick(){if(!queued){queued=true;requestAnimationFrame(motion)}}addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick,{passive:true});bindReveal();select('all');tick();
</script></body></html>
