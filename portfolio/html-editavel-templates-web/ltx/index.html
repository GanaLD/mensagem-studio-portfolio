<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTX — O modelo de mundo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --retake-ease:cubic-bezier(0.22,1,0.36,1);
  --retake-slow-ease:cubic-bezier(0.65,0,0.35,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
button{font-family:'Manrope',system-ui,sans-serif;color:inherit}
::selection{background:rgba(255,255,255,.2)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.stage{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;pointer-events:none;visibility:hidden}
.media.is-visible{visibility:visible}
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero h1{position:absolute;top:35.9%;left:50%;transform:translateX(-50%);margin:0;width:min(901px,calc(100vw - 48px));font-size:clamp(62px,6.8vw,100px);font-weight:500;line-height:.8;letter-spacing:-.04em;white-space:nowrap;text-align:center;text-shadow:0 2px 12px rgb(0 0 0 / .14)}
.hero h1 span{display:inline-block;transition:opacity 900ms var(--retake-ease),filter 900ms var(--retake-ease),transform 900ms var(--retake-ease)}
.hero h1 span:nth-child(1){transition-delay:0ms}
.hero h1 span:nth-child(2){transition-delay:90ms}
.hero h1 span:nth-child(3){transition-delay:180ms}
.stage.title-hidden .hero h1 span{opacity:0;filter:blur(12px);transform:translateY(-10px)}
.hero p{position:absolute;top:calc(46.78% + 94px);left:50%;transform:translateX(-50%);margin:0;width:min(734px,calc(100vw - 48px));font-size:clamp(14px,1.25vw,18px);font-weight:400;line-height:1.2;letter-spacing:-.04em;text-align:center;text-shadow:0 1px 8px rgb(0 0 0 / .16)}

header{position:absolute;top:0;left:0;width:100%;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:calc(58px + env(safe-area-inset-top)) 40px 40px;text-shadow:0 1px 6px rgb(0 0 0 / .18)}
.brand-wrap{display:flex;align-items:center;min-width:0}
.brand{display:inline-flex;align-items:center;color:#fff}
.brand svg{display:block;height:24px;width:auto}
.meta{margin-left:clamp(48px,5vw,70px);display:flex;gap:clamp(28px,3vw,44px);font-size:18px;line-height:1.2;letter-spacing:-.04em;white-space:nowrap}
.try{width:152px;height:38px;border-radius:999px;border:1px solid rgb(255 255 255 / .75);background:transparent;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;transition:color 300ms ease,background 300ms ease,border-color 300ms ease;position:relative}
.try:hover,.try:focus-visible{background:#fff;color:#0b1a26;border-color:#fff}

.controller{position:absolute;top:46.78%;left:50%;transform:translateX(-50%);width:min(880px,calc(100vw - 48px));height:72px;z-index:20;--glass-x:24%;--glass-y:8%;--cap-left:-5px;--cap-width:calc(20% + 5px)}
.track,.capsule{position:absolute;border-radius:999px}
.track{top:4px;left:0;width:100%;height:64px;background:rgb(24 55 82 / .31);border:1px solid rgb(255 255 255 / .2);-webkit-backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);box-shadow:0 14px 38px rgb(4 24 43 / .16),0 2px 7px rgb(4 24 43 / .1),inset 1px 1px 0 rgb(255 255 255 / .48),inset -1px -1px 0 rgb(21 49 73 / .14),inset 0 0 0 .5px rgb(255 255 255 / .16);transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),opacity 400ms linear}
.capsule{height:72px;top:-1px;left:var(--cap-left,-5px);width:var(--cap-width,calc(20% + 5px));background:rgb(246 251 255 / .24);border:1px solid rgb(255 255 255 / .28);-webkit-backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);box-shadow:0 11px 28px rgb(4 24 43 / .17),0 2px 6px rgb(4 24 43 / .1),inset 1px 1px 0 rgb(255 255 255 / .62),inset -1px -1px 0 rgb(20 49 73 / .18),inset 0 0 12px rgb(255 255 255 / .055);transition:left 620ms var(--retake-ease),width 620ms var(--retake-ease),top 980ms var(--retake-slow-ease),transform 980ms var(--retake-slow-ease),background 520ms ease,opacity 520ms ease}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.glass::before{background:radial-gradient(120% 150% at var(--glass-x,24%) var(--glass-y,8%),rgb(255 255 255 / .25),rgb(255 255 255 / 0) 53%),linear-gradient(115deg,rgb(255 255 255 / .10),rgb(255 255 255 / 0) 42%)}
.glass::after{padding:1px;background:conic-gradient(from 225deg,#7fe3ff,rgb(255 255 255 / .35),#ffffff,#ffd7e6,rgb(255 255 255 / .35),#7fe3ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.track.glass::after{opacity:.27}
.capsule.glass::after{opacity:.30}

.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.cell{display:flex;align-items:center;justify-content:center;height:100%;padding:0 14px;font-size:23px;font-weight:400;line-height:1.2;letter-spacing:-.04em;white-space:nowrap;transition:opacity 420ms var(--retake-ease),filter 420ms var(--retake-ease),transform 980ms var(--retake-slow-ease);position:relative;z-index:2}
button.cell{background:transparent;border:0;border-radius:999px;cursor:pointer}
button.cell:disabled{cursor:default}
.select-label{pointer-events:none}
.controller.highlighting .select-label{opacity:.5;transition-duration:300ms}
.controller.collapsing{--cap-left:calc(50% - 100px);--cap-width:200px}
.controller.collapsing .capsule,.controller.selected .capsule{background:rgb(246 251 255 / .14)}
.controller.collapsing .track{left:calc(50% - 96px);width:192px;opacity:0;transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),opacity 400ms linear 650ms}
.controller.collapsing .cell:not(.chosen){opacity:0;filter:blur(10px);transform:scale(.94);pointer-events:none}
.controller .chosen{transform:translate(var(--travel-x,0px),var(--travel-y,0px))}
.controller.selected{--cap-left:calc(50% - 100px);--cap-width:200px}
.controller.selected .track{left:calc(50% - 96px);width:192px;opacity:0}
.controller.selected .cell:not(.chosen){opacity:0;filter:blur(10px);transform:scale(.94);pointer-events:none}
.controller.selected .chosen{transform:translate(var(--travel-x,0px),var(--travel-y,0px));text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;animation:resetReveal 520ms var(--retake-ease) both}
.controller.expanding{--cap-left:-5px;--cap-width:calc(20% + 5px)}
.controller.expanding .track{left:0;width:100%;opacity:1;transition:left 980ms var(--retake-slow-ease),width 980ms var(--retake-slow-ease),opacity 400ms linear}
.controller.expanding .capsule{background:rgb(246 251 255 / .24)}
.controller.expanding .cell{transition:opacity 760ms var(--retake-ease) 60ms,filter 760ms var(--retake-ease) 60ms,transform 980ms var(--retake-slow-ease)}
.controller.expanding .chosen{opacity:0;filter:blur(10px)}
@keyframes resetReveal{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}

.live{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.notice{position:absolute;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:999px;background:rgb(24 55 82 / .72);border:1px solid rgb(255 255 255 / .28);-webkit-backdrop-filter:blur(13px) saturate(128%);backdrop-filter:blur(13px) saturate(128%);font-size:14px;box-shadow:0 11px 28px rgb(4 24 43 / .2)}
.notice.show{display:flex}
.notice button{min-width:72px;height:38px;border-radius:999px;border:1px solid rgb(255 255 255 / .75);background:transparent;color:#fff;cursor:pointer;font-size:14px}
.notice button:hover,.notice button:focus-visible{background:#fff;color:#0b1a26}

@media (max-width:900px){
  header{padding:calc(24px + env(safe-area-inset-top)) 24px 24px}
  .meta{font-size:14px;gap:22px;margin-left:34px}
  .try{width:116px;height:36px;font-size:14px}
  .cell{font-size:clamp(17px,2.5vw,24px)}
}
@media (max-width:700px){
  header{padding-left:18px;padding-right:18px}
  .brand svg{height:21px}
  .meta{font-size:12px}
  .meta .smart{display:none}
  .try{width:92px;height:34px;font-size:13px}
  .try::after{content:"";position:absolute;inset:-6px -10px}
  .hero h1{top:34%;width:calc(100vw - 40px);font-size:clamp(48px,14vw,64px);line-height:.88;white-space:normal}
  .hero p{top:77%;width:calc(100vw - 44px);font-size:14px}
  .controller{top:53%;width:calc(100vw - 40px);height:156px}
  .track{top:0;height:156px;border-radius:28px}
  .cells{grid-template-columns:repeat(2,1fr);grid-template-rows:48px 54px 54px}
  .cell{font-size:17px;border-radius:0}
  .select-label{grid-column:1/-1;border-bottom:1px solid rgb(255 255 255 / .12)}
  .cell[data-index="1"],.cell[data-index="3"]{border-right:1px solid rgb(255 255 255 / .12)}
  .cell[data-index="1"],.cell[data-index="2"]{border-bottom:1px solid rgb(255 255 255 / .12)}
  .capsule{opacity:0;pointer-events:none}
  button.cell:active{background:rgb(255 255 255 / .08)}
  button.cell:focus-visible{outline-offset:-3px}
  .controller.collapsing,.controller.selected{--cap-left:50%;--cap-width:196px}
  .controller.collapsing .capsule,.controller.selected .capsule{opacity:1;left:50%;top:4vh;top:4dvh;transform:translate(-50%,-50%);width:196px;height:64px;border-radius:999px;background:rgb(246 251 255 / .18)}
  .controller.collapsing .track,.controller.selected .track{left:0;width:100%;opacity:0}
  .controller .chosen,.controller.selected .chosen{transform:translate(var(--travel-x,0px),var(--travel-y,0px))}
  .controller.expanding .capsule{opacity:0;left:50%;width:196px}
  .controller.expanding .track{left:0;width:100%;opacity:1}
}
@media (max-width:700px) and (max-height:700px){
  .controller{top:50%}
  .hero p{top:calc(50% + 168px);width:calc(100vw - 32px);font-size:13px}
}
@media (max-height:520px) and (orientation:landscape){
  .hero h1{top:20%;font-size:clamp(34px,8vh,56px)}
  .controller{top:50%}
  .hero p{top:auto;bottom:8px;font-size:13px}
}
@media (max-width:700px) and (max-height:520px) and (orientation:landscape){
  .hero h1{top:12%;font-size:clamp(28px,7vh,44px)}
  .controller{top:46%;height:118px}
  .track{height:118px}
  .cells{grid-template-rows:36px 41px 41px}
  .cell{font-size:15px}
  .hero p{bottom:6px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .capsule,.track,.cell,.hero h1 span,.try{transition-duration:1ms!important;transition-delay:0ms!important}
  .stage.title-hidden .hero h1 span,.controller.collapsing .cell:not(.chosen),.controller.selected .cell:not(.chosen),.controller.expanding .chosen{filter:none!important}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <video id="v1f" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v1r" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v2f" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v2r" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v3f" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v3r" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v4f" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="v4r" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

  <section class="hero" aria-labelledby="hero-title">
    <h1 id="hero-title"><span>O</span> <span>modelo</span> <span>de mundo</span></h1>
    <p>A LTX cria modelos de mundo aberto que oferecem controle total — de vídeos com qualidade de produção a sistemas que compreendem e operam no mundo físico.</p>
  </section>

  <div class="controller" id="controller" role="group" aria-label="Controlador de estado da cena">
    <div class="track glass" aria-hidden="true"></div>
    <div class="capsule glass" aria-hidden="true"></div>
    <div class="cells">
      <div class="cell select-label" data-index="0">Selecione →</div>
      <button class="cell" type="button" data-index="1" data-branch="scene" disabled>Cena</button>
      <button class="cell" type="button" data-index="2" data-branch="light" disabled>Iluminação</button>
      <button class="cell" type="button" data-index="3" data-branch="colorway" disabled>Vestuário</button>
      <button class="cell" type="button" data-index="4" data-branch="fullLook" disabled>Elenco</button>
    </div>
  </div>

  <header>
    <div class="brand-wrap">
      <a class="brand" href="https://ltx.io/" aria-label="Página inicial da LTX">
        <svg viewBox="0 0 75 32" role="img" aria-hidden="true" focusable="false">
          <path fill="#fff" d="M0 3h6v21h15v5H0V3z"/>
          <path fill="#fff" d="M24 3h26v5H40v21h-6V8H24V3z"/>
          <path fill="#fff" d="M51 3h7.2l5.3 8.1L68.8 3H75l-8.2 12.2L75 29h-7.1l-5-8.8-5.6 8.8H51l8.5-13.2L51 3z"/>
        </svg>
      </a>
      <div class="meta"><span>LTX-2.5 chegou</span><span class="smart">Mais inteligente. Mais rápido</span></div>
    </div>
    <span aria-hidden="true"></span>
    <a class="try" href="https://app.ltx.io/" target="_blank" rel="noopener noreferrer">Testar agora</a>
  </header>

  <div id="status" class="live" role="status" aria-live="polite" aria-atomic="true">Carregando cena.</div>
  <div id="notice" class="notice" role="alert">
    <span id="noticeText">Falha na transição.</span>
    <button id="retry" type="button">Tentar novamente</button>
  </div>
</main>
<script>
(function(){
  'use strict';

  var stage=document.getElementById('stage');
  var controller=document.getElementById('controller');
  var statusEl=document.getElementById('status');
  var notice=document.getElementById('notice');
  var noticeText=document.getElementById('noticeText');
  var retryButton=document.getElementById('retry');
  var buttons=Array.prototype.slice.call(controller.querySelectorAll('button.cell'));
  var cells=Array.prototype.slice.call(controller.querySelectorAll('.cell'));
  var videos={
    v1f:document.getElementById('v1f'),v1r:document.getElementById('v1r'),
    v2f:document.getElementById('v2f'),v2r:document.getElementById('v2r'),
    v3f:document.getElementById('v3f'),v3r:document.getElementById('v3r'),
    v4f:document.getElementById('v4f'),v4r:document.getElementById('v4r')
  };
  var branches={
    scene:{key:'scene',label:'Cena',index:1,forward:videos.v2f,reverse:videos.v2r,forwardDuration:2.08,reverseDuration:2.08,reverseGuard:.18},
    light:{key:'light',label:'Iluminação',index:2,forward:videos.v3f,reverse:videos.v3r,forwardDuration:2.08,reverseDuration:2.04,reverseGuard:.08},
    colorway:{key:'colorway',label:'Vestuário',index:3,forward:videos.v1f,reverse:videos.v1r,forwardDuration:2.08,reverseDuration:2.08,reverseGuard:.08},
    fullLook:{key:'fullLook',label:'Elenco',index:4,forward:videos.v4f,reverse:videos.v4r,forwardDuration:3.00,reverseDuration:2.48,reverseGuard:.08}
  };
  var scene='base';
  var playback='loading';
  var direction='forward';
  var locked=false;
  var token=0;
  var visibleVideo=null;
  var activeBranch=null;
  var activeButton=null;
  var originHadFocus=false;
  var ready={};
  var failureAction=null;
  var completionCleanup=null;

  function announce(text){statusEl.textContent=text}
  function setNotice(text,show){noticeText.textContent=text;notice.classList.toggle('show',!!show)}
  function nextToken(){token+=1;return token}
  function valid(t){return t===token}
  function buttonFor(key){return controller.querySelector('button[data-branch="'+key+'"]')}
  function setCap(index){
    var left='-5px',width='calc(20% + 5px)';
    if(index===1){left='20%';width='20%'}
    if(index===2){left='40%';width='20%'}
    if(index===3){left='60%';width='20%'}
    if(index===4){left='80%';width='calc(20% + 5px)'}
    controller.style.setProperty('--cap-left',left);
    controller.style.setProperty('--cap-width',width);
  }
  function pairReady(b){return b.forward.readyState>=2&&b.reverse.readyState>=2}
  function refreshReadiness(){
    var k,b,btn;
    for(k in branches){
      if(branches.hasOwnProperty(k)){
        b=branches[k];
        ready[k]=pairReady(b);
        btn=buttonFor(k);
        if(scene==='base'&&!locked){btn.disabled=!ready[k];btn.removeAttribute('aria-hidden');btn.removeAttribute('tabindex')}
      }
    }
    if(videos.v1f.readyState>=2 && !visibleVideo){
      videos.v1f.pause();
      try{videos.v1f.currentTime=0}catch(e){}
      videos.v1f.classList.add('is-visible');
      visibleVideo=videos.v1f;
      playback='ready';
      announce('Cena pronta. Selecione um estado.');
    }
  }
  function onLoaded(){refreshReadiness()}
  Object.keys(videos).forEach(function(id){
    var v=videos[id];
    if(v.readyState>=2){refreshReadiness()}
    v.addEventListener('loadeddata',onLoaded);
    v.addEventListener('error',function(){refreshReadiness()});
  });
  refreshReadiness();

  function disableAll(){
    buttons.forEach(function(btn){btn.disabled=true});
  }
  function restoreBaseControls(focusBranch){
    buttons.forEach(function(btn){
      var key=btn.getAttribute('data-branch');
      btn.textContent=branches[key].label;
      btn.classList.remove('chosen');
      btn.style.removeProperty('--travel-x');
      btn.style.removeProperty('--travel-y');
      btn.disabled=!ready[key];
      btn.removeAttribute('aria-hidden');
      btn.removeAttribute('tabindex');
    });
    if(focusBranch){
      var fb=buttonFor(focusBranch);
      if(fb){try{fb.focus({preventScroll:true})}catch(e){fb.focus()}}
    }
  }
  function showOnly(video){
    Object.keys(videos).forEach(function(id){videos[id].classList.remove('is-visible')});
    video.classList.add('is-visible');
    visibleVideo=video;
  }
  function cleanupCompletion(){
    if(completionCleanup){completionCleanup();completionCleanup=null}
  }

  function measureTravel(btn){
    var rect=btn.getBoundingClientRect();
    var cRect=controller.getBoundingClientRect();
    var mobile=window.matchMedia('(max-width:700px)').matches;
    var cx;
    var cy;
    if(mobile){
      cx=cRect.left+(cRect.width/2);
      cy=cRect.top+(window.innerHeight*.04);
    }else{
      cx=cRect.left+(cRect.width/2);
      cy=cRect.top+35;
    }
    var bx=rect.left+rect.width/2;
    var by=rect.top+rect.height/2;
    btn.style.setProperty('--travel-x',(cx-bx)+'px');
    btn.style.setProperty('--travel-y',(cy-by)+'px');
  }

  function beginCollapse(btn){
    cells.forEach(function(c){c.classList.remove('chosen')});
    btn.classList.add('chosen');
    measureTravel(btn);
    controller.classList.remove('selected','expanding','highlighting');
    controller.classList.add('collapsing');
    controller.style.setProperty('--cap-left','calc(50% - 100px)');
    controller.style.setProperty('--cap-width','200px');
  }
  function commitSelected(branch,btn,t){
    if(!valid(t)){return}
    controller.classList.remove('collapsing','expanding');
    controller.classList.add('selected');
    btn.textContent='Redefinir';
    btn.disabled=false;
    btn.setAttribute('aria-hidden','false');
    btn.removeAttribute('tabindex');
    buttons.forEach(function(other){
      if(other!==btn){other.disabled=true;other.setAttribute('aria-hidden','true');other.setAttribute('tabindex','-1')}
    });
    scene=branch.key;
    playback='ready';
    locked=false;
    activeBranch=branch;
    activeButton=btn;
    announce(branch.label+' selecionado. Redefinir está disponível.');
    if(originHadFocus){try{btn.focus({preventScroll:true})}catch(e){btn.focus()}}
  }
  function beginExpand(btn){
    controller.classList.remove('collapsing','selected','highlighting');
    controller.classList.add('expanding');
    controller.style.setProperty('--cap-left','-5px');
    controller.style.setProperty('--cap-width','calc(20% + 5px)');
    if(btn){btn.textContent='Reset'}
  }
  function commitBase(branch,btn,t){
    if(!valid(t)){return}
    controller.classList.remove('expanding','collapsing','selected','highlighting');
    setCap(0);
    stage.classList.remove('title-hidden');
    scene='base';
    playback='ready';
    direction='forward';
    locked=false;
    activeBranch=null;
    activeButton=null;
    restoreBaseControls(originHadFocus?branch.key:null);
    announce('Cena base restaurada. Selecione um estado.');
  }

  function PausableDeadline(ms,onTimeout){
    this.remaining=ms;
    this.started=0;
    this.timer=0;
    this.onTimeout=onTimeout;
  }
  PausableDeadline.prototype.start=function(){
    var self=this;
    if(this.timer||document.hidden){return}
    this.started=Date.now();
    this.timer=setTimeout(function(){self.timer=0;self.remaining=0;self.onTimeout()},this.remaining);
  };
  PausableDeadline.prototype.pause=function(){
    if(!this.timer){return}
    clearTimeout(this.timer);
    this.timer=0;
    this.remaining=Math.max(0,this.remaining-(Date.now()-this.started));
  };
  PausableDeadline.prototype.clear=function(){if(this.timer){clearTimeout(this.timer)}this.timer=0};

  function rewind(video,t){
    return new Promise(function(resolve,reject){
      if(!valid(t)){reject(new Error('stale'));return}
      video.pause();
      if(video.currentTime<=.001){try{video.currentTime=0}catch(e){}resolve();return}
      var done=false;
      function clean(){video.removeEventListener('seeked',ok);video.removeEventListener('error',bad)}
      function ok(){if(done){return}done=true;clean();resolve()}
      function bad(){if(done){return}done=true;clean();reject(new Error('seek failed'))}
      video.addEventListener('seeked',ok);
      video.addEventListener('error',bad);
      try{video.currentTime=0}catch(e){clean();reject(e)}
    });
  }

  function waitFirstDecodedFrame(video,t){
    return new Promise(function(resolve,reject){
      var done=false;
      var rvfcId=0;
      var raf1=0,raf2=0;
      var startedFallback=false;
      var deadline=new PausableDeadline(12000,function(){finish(new Error('First frame timed out'))});
      function cleanup(){
        deadline.clear();
        document.removeEventListener('visibilitychange',visibilityChanged);
        video.removeEventListener('playing',fallbackPlaying);
        video.removeEventListener('error',mediaError);
        if(rvfcId&&video.cancelVideoFrameCallback){try{video.cancelVideoFrameCallback(rvfcId)}catch(e){}}
        if(raf1){cancelAnimationFrame(raf1)}
        if(raf2){cancelAnimationFrame(raf2)}
      }
      function finish(err){
        if(done){return}
        done=true;
        cleanup();
        if(err){reject(err)}else{resolve()}
      }
      function mediaError(){finish(new Error('Media error'))}
      function frame(now,meta){
        if(done||!valid(t)){finish(new Error('stale'));return}
        if(video.readyState>=2 && meta && meta.mediaTime<=.5){finish();return}
        rvfcId=video.requestVideoFrameCallback(frame);
      }
      function fallbackCheck(){
        if(done||!valid(t)){finish(new Error('stale'));return}
        if(video.readyState<2){return}
        raf1=requestAnimationFrame(function(){
          raf2=requestAnimationFrame(function(){
            if(video.readyState>=2){finish()}
          });
        });
      }
      function fallbackPlaying(){
        if(startedFallback){return}
        startedFallback=true;
        fallbackCheck();
      }
      function visibilityChanged(){
        if(done){return}
        if(document.hidden){
          deadline.pause();
          video.pause();
          try{video.currentTime=0}catch(e){}
        }else{
          deadline.start();
          var p;
          try{p=video.play()}catch(e2){finish(e2);return}
          if(p&&typeof p.catch==='function'){p.catch(function(err){finish(err)})}
        }
      }
      document.addEventListener('visibilitychange',visibilityChanged);
      video.addEventListener('error',mediaError);
      if(video.requestVideoFrameCallback){
        rvfcId=video.requestVideoFrameCallback(frame);
      }else{
        video.addEventListener('playing',fallbackPlaying);
        if(video.readyState>=2 && !video.paused){fallbackPlaying()}
      }
      deadline.start();
    });
  }

  function prepareAndPlay(video,t,alreadyVisible){
    return rewind(video,t).then(function(){
      if(!valid(t)){throw new Error('stale')}
      if(alreadyVisible){
        var p0=video.play();
        return p0&&typeof p0.then==='function'?p0:Promise.resolve();
      }
      var framePromise=waitFirstDecodedFrame(video,t);
      var playPromise;
      try{playPromise=video.play()}catch(e){return Promise.reject(e)}
      if(!playPromise||typeof playPromise.then!=='function'){playPromise=Promise.resolve()}
      return Promise.all([playPromise,framePromise]).then(function(){
        if(!valid(t)){throw new Error('stale')}
        showOnly(video);
      });
    });
  }

  function monitorToHold(video,duration,guard,t,isForward,onHold){
    return new Promise(function(resolve,reject){
      var raf=0;
      var ended=false;
      var threshold=Math.max(0,duration-guard);
      var titleAt=isForward?Math.min(duration*.12,.9):Infinity;
      function clean(){
        if(raf){cancelAnimationFrame(raf)}
        video.removeEventListener('ended',onEnded);
        video.removeEventListener('error',onError);
      }
      function finish(){
        if(ended){return}
        ended=true;
        clean();
        try{video.pause()}catch(e){}
        if(onHold){onHold()}
        resolve();
      }
      function onEnded(){if(valid(t)){finish()}}
      function onError(){clean();reject(new Error('Playback error'))}
      function tick(){
        if(!valid(t)){clean();reject(new Error('stale'));return}
        if(isForward && video.currentTime>=titleAt){stage.classList.add('title-hidden')}
        if(video.currentTime>=threshold || video.ended){finish();return}
        raf=requestAnimationFrame(tick);
      }
      video.addEventListener('ended',onEnded);
      video.addEventListener('error',onError);
      raf=requestAnimationFrame(tick);
      completionCleanup=clean;
    });
  }

  function failTransition(err,phase,branch,btn,t){
    if(!valid(t)){return}
    cleanupCompletion();
    playback='error';
    locked=false;
    failureAction={phase:phase,branch:branch.key};
    setNotice('Não foi possível concluir a transição.',true);
    announce('Falha na transição. Tentar novamente está disponível.');
    if(phase==='forward'){
      controller.classList.remove('collapsing','selected','expanding');
      setCap(0);
      stage.classList.remove('title-hidden');
      scene='base';
      activeBranch=null;
      activeButton=null;
      restoreBaseControls(originHadFocus?branch.key:null);
    }else{
      controller.classList.remove('expanding','collapsing');
      controller.classList.add('selected');
      stage.classList.add('title-hidden');
      scene=branch.key;
      activeBranch=branch;
      activeButton=btn;
      btn.classList.add('chosen');
      btn.textContent='Redefinir';
      btn.disabled=false;
      buttons.forEach(function(other){
        if(other!==btn){other.disabled=true;other.setAttribute('aria-hidden','true');other.setAttribute('tabindex','-1')}
      });
      if(originHadFocus){try{btn.focus({preventScroll:true})}catch(e){btn.focus()}}
    }
  }

  function startForward(branch,btn){
    if(locked||scene!=='base'||!ready[branch.key]){return}
    var t=nextToken();
    locked=true;
    playback='starting';
    direction='forward';
    activeBranch=branch;
    activeButton=btn;
    failureAction=null;
    setNotice('',false);
    originHadFocus=(document.activeElement===btn);
    disableAll();
    beginCollapse(btn);
    announce('Carregando transição de '+branch.label+'.');
    var alreadyVisible=(visibleVideo===branch.forward);
    prepareAndPlay(branch.forward,t,alreadyVisible).then(function(){
      if(!valid(t)){return}
      playback='playing';
      announce('Reproduzindo transição de '+branch.label+'.');
      return monitorToHold(branch.forward,branch.forwardDuration,.08,t,true,null);
    }).then(function(){
      if(!valid(t)){return}
      commitSelected(branch,btn,t);
    }).catch(function(err){
      if(String(err&&err.message)==='stale'){return}
      failTransition(err,'forward',branch,btn,t);
    });
  }

  function startReverse(branch,btn){
    if(locked||scene!==branch.key){return}
    var t=nextToken();
    locked=true;
    playback='starting';
    direction='reverse';
    failureAction=null;
    setNotice('',false);
    originHadFocus=(document.activeElement===btn)||originHadFocus;
    disableAll();
    stage.classList.add('title-hidden');
    beginExpand(btn);
    announce('Retornando à cena base.');
    prepareAndPlay(branch.reverse,t,visibleVideo===branch.reverse).then(function(){
      if(!valid(t)){return}
      playback='playing';
      return monitorToHold(branch.reverse,branch.reverseDuration,branch.reverseGuard,t,false,null);
    }).then(function(){
      if(!valid(t)){return}
      commitBase(branch,btn,t);
    }).catch(function(err){
      if(String(err&&err.message)==='stale'){return}
      failTransition(err,'reverse',branch,btn,t);
    });
  }

  buttons.forEach(function(btn){
    btn.addEventListener('click',function(){
      var key=btn.getAttribute('data-branch');
      var branch=branches[key];
      if(locked){return}
      if(scene==='base'){startForward(branch,btn)}
      else if(scene===branch.key && btn===activeButton){startReverse(branch,btn)}
    });
    btn.addEventListener('mouseenter',function(){
      if(window.matchMedia('(max-width:700px)').matches||locked||scene!=='base'){return}
      controller.classList.add('highlighting');
      setCap(parseInt(btn.getAttribute('data-index'),10));
    });
    btn.addEventListener('focus',function(){
      if(window.matchMedia('(max-width:700px)').matches||locked||scene!=='base'){return}
      controller.classList.add('highlighting');
      setCap(parseInt(btn.getAttribute('data-index'),10));
    });
    btn.addEventListener('blur',function(){
      if(window.matchMedia('(max-width:700px)').matches||locked||scene!=='base'){return}
      setTimeout(function(){
        if(!controller.contains(document.activeElement)){controller.classList.remove('highlighting');setCap(0)}
      },0);
    });
  });
  controller.addEventListener('mouseleave',function(){
    if(window.matchMedia('(max-width:700px)').matches||locked||scene!=='base'){return}
    if(!controller.contains(document.activeElement)){controller.classList.remove('highlighting');setCap(0)}
  });
  controller.addEventListener('pointermove',function(e){
    var r=controller.getBoundingClientRect();
    var x=((e.clientX-r.left)/r.width)*100;
    var y=((e.clientY-r.top)/r.height)*100;
    controller.style.setProperty('--glass-x',Math.max(0,Math.min(100,x))+'%');
    controller.style.setProperty('--glass-y',Math.max(0,Math.min(100,y))+'%');
  });

  retryButton.addEventListener('click',function(){
    if(!failureAction){return}
    setNotice('',false);
    var b=branches[failureAction.branch];
    var btn=buttonFor(b.key);
    if(failureAction.phase==='forward'){startForward(b,btn)}
    else{startReverse(b,btn)}
  });

  window.addEventListener('resize',function(){
    if(activeButton && (controller.classList.contains('collapsing')||controller.classList.contains('selected'))){measureTravel(activeButton)}
  });

})();
</script>
