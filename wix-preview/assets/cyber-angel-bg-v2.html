<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cyber Angel Scroll V2.1.5 FINAL POUSO AJUSTADO</title>
<style>
  :root{
    --scene-scroll-vh: 760;
    --bg-width: 100vw;
    --stage-bg: #030607;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--stage-bg);color:#fff}
  html{scroll-behavior:auto}
  body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
  html.embed-mode,html.embed-mode body{height:100%;overflow:hidden}
  html.embed-mode #cyber-scene{height:100vh!important;min-height:100vh!important}
  html.embed-mode #cyber-stage{position:fixed!important;inset:0!important;top:0!important;height:100vh!important;min-height:100vh!important}

  /* A cena gera o curso de scroll. */
  #cyber-scene{
    position:relative;
    height:calc(var(--scene-scroll-vh) * 1vh);
    min-height:100vh;
  }

  /* Tudo visual fica preso na viewport. */
  #cyber-stage{
    position:sticky;
    top:0;
    width:100%;
    height:100svh;
    min-height:100vh;
    overflow:hidden;
    background:#030607;
    isolation:isolate;
  }

  /* Fundo auxiliar para preencher laterais em telas muito largas. */
  #ambient-bg{
    position:absolute;
    inset:-4%;
    width:108%;
    height:108%;
    object-fit:cover;
    filter:blur(28px) brightness(.38) saturate(.85);
    transform:scale(1.08);
    z-index:0;
    pointer-events:none;
  }

  /* Imagem principal é posicionada em px pelo JS para preservar coordenadas. */
  #world-bg{
    position:absolute;
    left:0;
    top:0;
    width:100vw;
    height:auto;
    max-width:none;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    z-index:1;
    will-change:transform;
  }

  /* Vinheta discreta para integrar o fundo à viewport. */
  #stage-vignette{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.12), transparent 18%, transparent 82%, rgba(0,0,0,.16)),
      radial-gradient(circle at center, transparent 48%, rgba(0,0,0,.22) 100%);
  }

  #angel{
    position:absolute;
    left:0;
    top:0;
    z-index:5;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
    max-width:none;
    height:auto;
    will-change:left,top,width,transform,opacity;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.34));
  }

  /* Camada reservada para conteúdo real da página. */
  #page-content{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
  }
  #page-content > *{pointer-events:auto}

  /* DEBUG: habilite adicionando ?debug=1 à URL. */
  #debug-hud{
    position:fixed;
    left:12px;
    bottom:12px;
    z-index:9999;
    display:none;
    padding:9px 11px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:10px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(8px);
    color:#fff;
    font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
    white-space:pre;
    pointer-events:none;
  }
  #landing-marker{
    position:absolute;
    z-index:20;
    width:18px;height:18px;
    margin:-9px 0 0 -9px;
    border:2px solid #ff2a2a;
    border-radius:50%;
    display:none;
    pointer-events:none;
  }
  #landing-marker::before,
  #landing-marker::after{
    content:"";
    position:absolute;
    background:#ff2a2a;
  }
  #landing-marker::before{left:7px;top:-10px;width:2px;height:34px}
  #landing-marker::after{top:7px;left:-10px;width:34px;height:2px}

  @media (prefers-reduced-motion: reduce){
    #angel{transition:none}
  }
</style>
</head>
<body>

<section id="cyber-scene" aria-label="Cyber Angel Scroll">
  <div id="cyber-stage">
    <img id="ambient-bg" src="./cyber-angel-images/image-00a5ab0b6a9ed2e1bf4d.png" alt="" aria-hidden="true">
    <img id="world-bg" src="./cyber-angel-images/image-00a5ab0b6a9ed2e1bf4d.png" alt="" aria-hidden="true">
    <div id="stage-vignette"></div>

    <img id="angel"
         src="./cyber-angel-images/image-4d3534b42f896e5bf52a.png"
         alt=""
         aria-hidden="true">

    <div id="landing-marker"></div>

    <div id="page-content">
      <!--
        INSIRA AQUI o conteúdo real da página.
        A animação fica por trás. O bloco já está acima do anjo pelo z-index.
      -->
    </div>
  </div>
</section>

<div id="debug-hud"></div>

<script>
(() => {
  "use strict";

  /*
   * ============================================================
   * CYBER ANGEL SCROLL V2.1.7 FINAL POUSO AJUSTADO + ASAS ATIVAS+ — CONFIGURAÇÃO CENTRAL
   * ============================================================
   * Coordenadas x/y abaixo são NORMALIZADAS no fundo:
   * 0 = começo da imagem, 1 = final da imagem.
   *
   * LANDING_TARGET marca o TOPO DO TORII onde o personagem pousa.
   * O sprite de pouso usa âncora inferior (anchorY=1.0), então a
   * base visível do PNG coincide com a travessa do portal.
   */

  const CONFIG = {
    source: {
      width: 768,
      height: 2048
    },

    scroll: {
      sceneVh: 760,
      smoothing: 0.115
    },

    background: {
      // Onde o topo do portal deve aparecer na viewport no fim.
      finalTargetViewportY: 0.58
    },

    phases: {
      flightEnd: 0.835,
      approachEnd: 0.915,
      landingEnd: 1.0
    },

    landingTarget: {
      // TOPO REAL da barra superior do torii.
      // Medido diretamente no fundo: y = 1620 / 2048.
      x: 0.500,
      y: 0.791015625
    },

    angel: {
      // V2.1: personagem exatamente 50% menor que na V2.
      flightWidthRelativeToBg: 0.1275,
      landingWidthRelativeToBg: 0.1375,
      minWidth: 59,
      maxFlightWidth: 180,
      maxLandingWidth: 195,

      // Âncora visual dos PNGs.
      flightAnchorX: 0.50,
      flightAnchorY: 0.51,
      landingAnchorX: 0.50,
      landingAnchorY: 1.00,

      // Ajuste visual final: desce o personagem 24 px para eliminar totalmente o vão e encostar por completo na barra do portal.
      landingContactOffsetPx: 24,

      // Descida física durante a sequência de pouso.
      landingDropViewport: 0.24
    },

    /*
     * V2.1 — TRAJETO VISÍVEL NA VIEWPORT.
     *
     * x/y são coordenadas normalizadas da TELA, não da imagem.
     * Isso impede o personagem de desaparecer enquanto o fundo faz o
     * travelling vertical. O trecho final converge dinamicamente para
     * o ponto de pouso real do torii.
     */
    viewportPath: [
      { t:0.00, x:0.52, y:0.18, scale:0.78, rot:-2.0 },
      { t:0.11, x:0.45, y:0.24, scale:0.82, rot:-4.0 },
      { t:0.23, x:0.48, y:0.31, scale:0.86, rot: 1.0 },
      { t:0.36, x:0.58, y:0.38, scale:0.90, rot: 5.0 },
      { t:0.49, x:0.64, y:0.45, scale:0.94, rot: 4.0 },
      { t:0.62, x:0.57, y:0.51, scale:0.98, rot:-2.0 },
      { t:0.74, x:0.47, y:0.55, scale:1.00, rot:-5.0 },
      { t:0.84, x:0.41, y:0.57, scale:1.02, rot:-4.0 },
      { t:0.92, x:0.44, y:0.56, scale:1.03, rot: 1.0 },
      { t:1.00, x:0.48, y:0.54, scale:1.04, rot: 0.0 }
    ],

    flightFrames: [
      "./cyber-angel-images/image-4d3534b42f896e5bf52a.png",
      "./cyber-angel-images/image-680bad876afd7b7cd3cc.png",
      "./cyber-angel-images/image-11f16a2d1affb0452e90.png",
      "./cyber-angel-images/image-03af0060a1a20b0953b4.png"
    ],

    // Ciclo expandido com mais frames aparentes para o bater de asas ficar mais rico.
    // Mantém o pouso intacto e adiciona uma pequena permanência nos extremos do flap.
    flightCycle: [0,1,2,3,3,2,1,0],

    landingFrames: [
      "./cyber-angel-images/image-0814e562b9e671f10348.png",
      "./cyber-angel-images/image-fb39bdae00e36994404a.png",
      "./cyber-angel-images/image-f7dbdd8bc6d0772beb13.png"
    ]
  };

  const scene = document.getElementById("cyber-scene");
  const stage = document.getElementById("cyber-stage");
  const worldBg = document.getElementById("world-bg");
  const ambientBg = document.getElementById("ambient-bg");
  const angel = document.getElementById("angel");
  const debugHud = document.getElementById("debug-hud");
  const landingMarker = document.getElementById("landing-marker");

  const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
  const EMBEDDED = window.parent !== window;
  let externalProgress = EMBEDDED ? 0 : null;
  let externallyActive = true;
  if(EMBEDDED) document.documentElement.classList.add("embed-mode");
  if (DEBUG) {
    debugHud.style.display = "block";
    landingMarker.style.display = "block";
  }

  scene.style.setProperty("--scene-scroll-vh", CONFIG.scroll.sceneVh);

  // Preload.
  [
    ...CONFIG.flightFrames,
    ...CONFIG.landingFrames,
    "./cyber-angel-images/image-7c3eee06709767a63499.png",
    "./cyber-angel-images/image-1a58332f6a6a733150d0.jpg"
  ].forEach(src => {
    const i = new Image();
    i.decoding = "async";
    i.src = src;
  });

  let metrics = null;
  let targetProgress = 0;
  let currentProgress = 0;
  let lastSrc = "";
  let raf = 0;
  let elapsedMs = 0;

  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const lerp = (a,b,t) => a + (b-a)*t;
  const invLerp = (a,b,v) => clamp((v-a)/(b-a),0,1);
  const smoothstep = t => t*t*(3-2*t);
  const easeInOutCubic = t => t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

  function resize(){
    const vw = stage.clientWidth;
    const vh = stage.clientHeight;
    const aspect = CONFIG.source.width / CONFIG.source.height;

    // O fundo principal sempre usa 100% da largura.
    const renderW = vw;
    const renderH = renderW / aspect;

    // Caso extremo: viewport alta demais. Garante cobertura vertical.
    const safeRenderH = Math.max(renderH, vh);
    const safeRenderW = safeRenderH * aspect;

    let finalBgTop = CONFIG.background.finalTargetViewportY * vh
                   - CONFIG.landingTarget.y * safeRenderH;

    const minBgTop = vh - safeRenderH;
    finalBgTop = clamp(finalBgTop, minBgTop, 0);

    metrics = {
      vw, vh,
      renderW: safeRenderW,
      renderH: safeRenderH,
      left: (vw - safeRenderW) * 0.5,
      finalBgTop,
      minBgTop
    };

    worldBg.style.width = safeRenderW + "px";
    worldBg.style.left = metrics.left + "px";

    // Ambient usa cover e não precisa compartilhar coordenadas.
    ambientBg.style.objectPosition = "50% 50%";

    updateTargetProgress();
    render(currentProgress, true);
  }

  function updateTargetProgress(){
    if(externalProgress !== null){
      targetProgress = clamp(externalProgress, 0, 1);
      return;
    }
    const rect = scene.getBoundingClientRect();
    const scrollable = Math.max(1, scene.offsetHeight - stage.clientHeight);
    targetProgress = clamp((-rect.top) / scrollable, 0, 1);
  }

  function pathSample(t){
    const pts = CONFIG.viewportPath;
    t = clamp(t,0,1);

    for(let i=0;i<pts.length-1;i++){
      const a = pts[i], b = pts[i+1];
      if(t >= a.t && t <= b.t){
        const u = smoothstep(invLerp(a.t,b.t,t));
        return {
          x: lerp(a.x,b.x,u),
          y: lerp(a.y,b.y,u),
          scale: lerp(a.scale,b.scale,u),
          rot: lerp(a.rot,b.rot,u)
        };
      }
    }
    return {...pts[pts.length-1]};
  }

  function setAngelSource(src){
    if(src !== lastSrc){
      lastSrc = src;
      angel.src = src;
    }
  }

  function imagePointToViewport(xNorm,yNorm,bgTop){
    return {
      x: metrics.left + xNorm * metrics.renderW,
      y: bgTop + yNorm * metrics.renderH
    };
  }

  function placeAngel({
    x, y, width, scale=1, rot=0,
    anchorX=.5, anchorY=.5,
    opacity=1
  }){
    angel.style.width = width + "px";
    angel.style.left = x + "px";
    angel.style.top = y + "px";
    angel.style.opacity = opacity;
    angel.style.transformOrigin = `${anchorX*100}% ${anchorY*100}%`;
    angel.style.transform =
      `translate(${-anchorX*100}%, ${-anchorY*100}%) rotate(${rot}deg) scale(${scale})`;
  }

  function flightFrameFor(timeMs){
    // Em voo o anjo bate as asas sozinho, independente do scroll.
    const flapFps = 7.8;
    const idx = Math.floor((timeMs / 1000) * flapFps);
    const cycleIndex = CONFIG.flightCycle[
      ((idx % CONFIG.flightCycle.length) + CONFIG.flightCycle.length) %
      CONFIG.flightCycle.length
    ];
    return CONFIG.flightFrames[cycleIndex];
  }

  function landingFrameFor(lp){
    // 02 DESCIDA -> 03 TOQUE -> 04 FINAL.
    // Scroll reverso executa 04 -> 03 -> 02 automaticamente.
    if(lp < 0.36) return CONFIG.landingFrames[0];
    if(lp < 0.70) return CONFIG.landingFrames[1];
    return CONFIG.landingFrames[2];
  }

  function render(p, force=false, timeMs=elapsedMs){
    if(!metrics) return;

    const {vh, renderW, renderH} = metrics;

    // Pan do mundo: termina exatamente com o portal na altura configurada.
    const bgEase = easeInOutCubic(p);
    const bgTop = lerp(0, metrics.finalBgTop, bgEase);
    worldBg.style.transform = `translate3d(0, ${bgTop}px, 0)`;

    const portalRaw = imagePointToViewport(
      CONFIG.landingTarget.x,
      CONFIG.landingTarget.y,
      bgTop
    );
    const portal = {
      x: portalRaw.x,
      y: portalRaw.y + CONFIG.angel.landingContactOffsetPx
    };

    if(DEBUG){
      landingMarker.style.left = portal.x + "px";
      landingMarker.style.top = portal.y + "px";
    }

    const flightEnd = CONFIG.phases.flightEnd;
    const approachEnd = CONFIG.phases.approachEnd;

    let state = "FLIGHT";

    if(p < approachEnd){
      state = p < flightEnd ? "FLIGHT" : "APPROACH";

      const local = invLerp(0, approachEnd, p);
      const pt = pathSample(local);

      const flightWidth = clamp(
        renderW * CONFIG.angel.flightWidthRelativeToBg,
        CONFIG.angel.minWidth,
        CONFIG.angel.maxFlightWidth
      );

      // V2.1: a rota-base fica sempre dentro da viewport.
      // O último trecho do approach converge para o início físico do pouso.
      const baseX = pt.x * metrics.vw;
      const baseY = pt.y * vh;

      const ap = invLerp(flightEnd, approachEnd, p);
      const settle = smoothstep(ap);

      const landingStartY = portal.y - CONFIG.angel.landingDropViewport * vh;
      const landingStartX = portal.x - renderW * 0.012;

      const bob = Math.sin((timeMs / 1000) * 4.2) * Math.min(7, vh * .006);

      let x = lerp(baseX, landingStartX, settle);
      let y = lerp(baseY + bob * (1-settle), landingStartY, settle);

      // Safety gate: durante voo/approach o centro do sprite jamais
      // pode abandonar a área visível da tela.
      const halfW = flightWidth * 0.52;
      const halfH = flightWidth * 0.48;
      x = clamp(x, halfW * 0.55, metrics.vw - halfW * 0.55);
      y = clamp(y, halfH * 0.65, vh - halfH * 0.65);

      setAngelSource(flightFrameFor(timeMs));

      placeAngel({
        x,
        y,
        width: flightWidth,
        scale: pt.scale * lerp(1, 0.98, settle),
        rot: lerp(pt.rot, 0, settle),
        anchorX: CONFIG.angel.flightAnchorX,
        anchorY: CONFIG.angel.flightAnchorY
      });

    } else {
      state = "LANDING";

      const lp = invLerp(approachEnd, CONFIG.phases.landingEnd, p);
      const eased = easeInOutCubic(lp);

      const landingWidth = clamp(
        renderW * CONFIG.angel.landingWidthRelativeToBg,
        CONFIG.angel.minWidth,
        CONFIG.angel.maxLandingWidth
      );

      // O fundo continua se movendo enquanto o pouso acontece.
      // Recalcula o alvo a cada frame para manter o personagem "colado"
      // ao portal em qualquer viewport.
      const drop = CONFIG.angel.landingDropViewport * vh;
      const startY = portal.y - drop;
      const y = lerp(startY, portal.y, eased);

      // Pequeno ajuste lateral durante a aproximação final.
      const x = portal.x + (1-eased) * (renderW * -0.012);

      setAngelSource(landingFrameFor(lp));

      placeAngel({
        x,
        y,
        width: landingWidth,
        scale: lerp(0.94,1.00,eased),
        rot: lerp(-1.5,0,eased),
        anchorX: CONFIG.angel.landingAnchorX,
        anchorY: CONFIG.angel.landingAnchorY
      });

      if(lp >= 0.985){
        state = "LANDED";
        // Último frame permanece exatamente apoiado sobre a travessa.
        setAngelSource(CONFIG.landingFrames[2]);
        placeAngel({
          x: portal.x,
          y: portal.y,
          width: landingWidth,
          scale:1,
          rot:0,
          anchorX:CONFIG.angel.landingAnchorX,
          anchorY:CONFIG.angel.landingAnchorY
        });
      }
    }

    if(DEBUG){
      debugHud.textContent =
        `CYBER ANGEL V2.1.7 ASAS+\n` +
        `progress : ${p.toFixed(4)}\n` +
        `state    : ${state}\n` +
        `bgTop    : ${bgTop.toFixed(1)}px\n` +
        `portal   : ${portal.x.toFixed(1)}, ${portal.y.toFixed(1)}\n` +
        `viewport : ${metrics.vw} × ${metrics.vh}`;
    }
  }

  function tick(now){
    elapsedMs = Number.isFinite(now) ? now : performance.now();

    if(externallyActive){
      const delta = targetProgress - currentProgress;
      currentProgress += delta * CONFIG.scroll.smoothing;

      if(Math.abs(delta) < 0.00008){
        currentProgress = targetProgress;
      }

      render(currentProgress, false, elapsedMs);
    }
    raf = requestAnimationFrame(tick);
  }

  function onScroll(){
    if(externalProgress === null) updateTargetProgress();
  }

  function onParentMessage(event){
    const data = event && event.data ? event.data : {};
    if(data.type === "cyber-angel-progress"){
      const next = Number(data.progress);
      if(Number.isFinite(next)){
        externalProgress = clamp(next,0,1);
        targetProgress = externalProgress;
        if(data.instant){
          currentProgress = targetProgress;
          render(currentProgress,true,elapsedMs || performance.now());
        }
      }
    }else if(data.type === "cyber-angel-active"){
      externallyActive = !!data.active;
      if(externallyActive){
        targetProgress = externalProgress === null ? targetProgress : externalProgress;
      }
    }
  }

  addEventListener("message", onParentMessage);
  addEventListener("scroll", onScroll, {passive:true});
  addEventListener("resize", resize, {passive:true});
  addEventListener("orientationchange", resize, {passive:true});

  worldBg.addEventListener("load", resize, {once:true});

  if(worldBg.complete) resize();
  updateTargetProgress();
  raf = requestAnimationFrame(tick);

  // API pequena para futura integração com editor/preview.
  window.CyberAngelV2 = {
    config: CONFIG,
    getProgress: () => currentProgress,
    setExternalProgress(value,instant=false){
      const next = Number(value);
      if(!Number.isFinite(next)) return;
      externalProgress = clamp(next,0,1);
      targetProgress = externalProgress;
      if(instant){
        currentProgress = targetProgress;
        render(currentProgress,true,elapsedMs || performance.now());
      }
    },
    setActive(value){ externallyActive = !!value; },
    setDebugLandingTarget(x,y){
      CONFIG.landingTarget.x = clamp(Number(x),0,1);
      CONFIG.landingTarget.y = clamp(Number(y),0,1);
      resize();
    },
    destroy(){
      cancelAnimationFrame(raf);
      removeEventListener("message", onParentMessage);
      removeEventListener("scroll", onScroll);
      removeEventListener("resize", resize);
      removeEventListener("orientationchange", resize);
    }
  };
})();
</script>
</body>
</html>
