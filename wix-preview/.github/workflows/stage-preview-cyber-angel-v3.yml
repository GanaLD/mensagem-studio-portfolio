          curl -L --fail --retry 3 -o "$base/landing/pouso_04_pouso_final.png" 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5bbd577d-4852-4240-9b8a-74196cea02d8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWRkZmVmNjBhMTg5NTAzNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA0NjE3Nn0.LxZBtlT1vbPjrMI_HRTPeV6iSC3omdJmaxRs-tFuupE'

          test -s "$base/background.jpg"
          test -s "$base/flight/01_anjo_esquerda.png"
          test -s "$base/landing/pouso_04_pouso_final.png"

      - name: Commit preview assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wix-preview/assets/cyber-angel-v3-preview/assets
          if git diff --cached --quiet; then
            echo 'Preview V3 assets already staged.'
            exit 0
          fi
          git commit -m 'Stage Cyber Angel V3 assets in preview only'
          git pull --rebase origin main
          git push
