name: Stage PREVIEW Cyber Angel V3 Assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage-preview-cyber-angel-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-preview-cyber-angel-v3
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved V3 preview assets
        shell: bash
        run: |
          set -euo pipefail
          base="wix-preview/assets/cyber-angel-v3-preview/assets"
          mkdir -p "$base/flight" "$base/landing"

          curl -L --fail --retry 3 -o "$base/background.jpg" 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/a276ef2d-0456-4b28-968b-e90218080821.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWQxNjdmMTcxNGUzMjY5OCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA2MTU5MX0.F4ZxmdClSzJjD8z8rQI9Vgp9rl0_Z2vd-EIJQGZonFw'
          curl -L --fail --retry 3 -o "$base/flight/01_anjo_esquerda.png" 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/34651b10-ad4a-4680-994c-68b4602ae359.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjU3YmMyOWEwMjEyNjM0ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA0NjM2Mn0.sBMI1fE0zjjTl8wfuq_aNXyOR9OuGVyj9MZlNrKuITY'
