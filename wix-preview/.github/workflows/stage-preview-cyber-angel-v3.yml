          curl -L --fail --retry 3 -o "$base/flight/03_anjo_centro_direita.png" 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1ec6aeab-f3c0-4ce4-95a9-2f5a0ab80448.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDEwNTBjMDY5MGMwZWU5MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA4NDk5OH0.fB1xB15Cu4AuqQwRhW6PD67NCsUyqm8kmxsXb8GXrcE'
          curl -L --fail --retry 3 -o "$base/flight/04_anjo_direita.png" 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/ce0cc11b-5a09-4347-9d82-239035482573.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGRmOWZiNmY2ZDdiZTY0MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA4MzU2N30.UWPAf630wt4Yq3143pJl50KnAWhp2fl3R7vkcc0-tu4'
