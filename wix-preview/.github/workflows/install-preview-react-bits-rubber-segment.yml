name: Install PREVIEW React Bits RubberSegment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-preview-react-bits-rubber-segment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-preview-react-bits-rubber-segment
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        working-directory: preview-21st-shader
        run: npm install --no-audit --no-fund

      - name: Install React Bits RubberSegment with shadcn
        working-directory: preview-21st-shader
        run: npx shadcn@latest add @react-bits/RubberSegment-JS-CSS --yes

      - name: Show generated files
        shell: bash
        run: |
          set -euo pipefail
          find preview-21st-shader/src -maxdepth 6 -type f | sort
          echo '--- package.json ---'
          cat preview-21st-shader/package.json

      - name: Commit RubberSegment source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-21st-shader
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Install React Bits RubberSegment for preview'
          git pull --rebase origin main
          git push
