name: Publish approved unified HERO 1 to production

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-approved-unified-hero.yml'

permissions:
  contents: write

concurrency:
  group: publish-approved-unified-hero
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote approved HERO asset and integration from preview to production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cena-hero-1
          cp wix-preview/assets/cena-hero-1/visualizador.html assets/cena-hero-1/visualizador.html

          python - <<'PY'
          from pathlib import Path

          preview_path = Path('wix-preview/index.html')
          prod_path = Path('index.html')
          preview = preview_path.read_text(encoding='utf-8')
          prod = prod_path.read_text(encoding='utf-8')

          def extract(text, start, end):
              if start not in text or end not in text:
                  raise SystemExit(f'Missing approved block: {start} / {end}')
              a = text.index(start)
              b = text.index(end, a) + len(end)
              return text[a:b]

          def remove_block(text, start, end):
              while start in text and end in text:
                  a = text.index(start)
                  b = text.index(end, a) + len(end)
                  text = text[:a] + text[b:]
              return text

          css = extract(preview, '<!-- CENA_HERO_1_PREVIEW_CSS_START -->', '<!-- CENA_HERO_1_PREVIEW_CSS_END -->')
          section = extract(preview, '<!-- CENA_HERO_1_PREVIEW_START -->', '<!-- CENA_HERO_1_PREVIEW_END -->')
          v4 = extract(preview, '<!-- CENA_HERO_1_V4_START -->', '<!-- CENA_HERO_1_V4_END -->')

          # Idempotent cleanup if this workflow is ever rerun.
          for s,e in [
              ('<!-- CENA_HERO_1_PRODUCTION_CSS_START -->','<!-- CENA_HERO_1_PRODUCTION_CSS_END -->'),
              ('<!-- CENA_HERO_1_PRODUCTION_START -->','<!-- CENA_HERO_1_PRODUCTION_END -->'),
              ('<!-- CENA_HERO_1_PRODUCTION_V4_START -->','<!-- CENA_HERO_1_PRODUCTION_V4_END -->'),
          ]:
              prod = remove_block(prod, s, e)
          prod = prod.replace('<script>window.__MS_UNIFIED_HERO_STAGE=true;</script>','')

          css = css.replace('CENA_HERO_1_PREVIEW_CSS_START','CENA_HERO_1_PRODUCTION_CSS_START').replace('CENA_HERO_1_PREVIEW_CSS_END','CENA_HERO_1_PRODUCTION_CSS_END')
          section = section.replace('CENA_HERO_1_PREVIEW_START','CENA_HERO_1_PRODUCTION_START').replace('CENA_HERO_1_PREVIEW_END','CENA_HERO_1_PRODUCTION_END')
          v4 = v4.replace('CENA_HERO_1_V4_START','CENA_HERO_1_PRODUCTION_V4_START').replace('CENA_HERO_1_V4_END','CENA_HERO_1_PRODUCTION_V4_END')

          # Keep production-specific head assets/typography intact; add only the approved HERO code.
          head_insert = css + '\n<script>window.__MS_UNIFIED_HERO_STAGE=true;</script>\n'
          if '</head>' not in prod:
              raise SystemExit('Production </head> not found')
          prod = prod.replace('</head>', head_insert + '</head>', 1)

          hero_marker = '<section id="hero" class="content-layer">'
          if hero_marker not in prod:
              raise SystemExit('Production hero marker not found')
          prod = prod.replace(hero_marker, section + '\n' + hero_marker, 1)

          if '</body>' not in prod:
              raise SystemExit('Production </body> not found')
          prod = prod.replace('</body>', v4 + '\n</body>', 1)

          prod_path.write_text(prod, encoding='utf-8')
          PY

      - name: Validate published integration
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/cena-hero-1/visualizador.html
          cmp -s wix-preview/assets/cena-hero-1/visualizador.html assets/cena-hero-1/visualizador.html
          grep -q 'CENA_HERO_1_PRODUCTION_START' index.html
          grep -q 'CENA_HERO_1_PRODUCTION_V4_START' index.html
          grep -q 'window.__MS_UNIFIED_HERO_STAGE=true' index.html
          grep -q 'id="msUnifiedHeroStage"' <(printf '%s' "$(cat index.html)") || grep -q "stage.id='msUnifiedHeroStage'" index.html
          grep -q '<link rel="stylesheet" href="/site-typography-v2.css' index.html
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          assert h.index('id="cenaHero1"') < h.index('id="hero" class="content-layer"')
          assert 'wix-preview/assets/cena-hero-1' not in h
          assert './assets/cena-hero-1/visualizador.html?embed=hero1' in h
          print('PASS: approved unified HERO is in production and production-only typography remains intact.')
          PY

      - name: Commit production publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/cena-hero-1/visualizador.html
          if git diff --cached --quiet; then
            echo 'Production already matches approved HERO.'
            exit 0
          fi
          git commit -m 'Publish approved unified HERO 1 to site [skip ci]'
          git push
